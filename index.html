<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5B3A29">
<title>제과산업기사 필기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --flour:#FAF0E1;
    --flour-card:#FFFBF4;
    --crust:#5B3A29;
    --charcoal:#2B211A;
    --caramel:#C17817;
    --caramel-dark:#9C5E10;
    --wheat:#E8C468;
    --jam:#A83232;
    --jam-bg:#F5DEDA;
    --sage:#6B8E5A;
    --sage-bg:#DFE9D6;
    --line:#E4D3B8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--flour);
    color:var(--charcoal);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .hidden{display:none !important;}

  /* ---------- 공통 ---------- */
  h1,h2,h3{
    font-family:'Gowun Batang', serif;
    font-weight:700;
    margin:0;
    color:var(--crust);
  }
  button{font-family:inherit;}
  button:focus-visible, .choice:focus-visible{
    outline:3px solid var(--caramel);
    outline-offset:2px;
  }

  /* ---------- 홈 화면 ---------- */
  .home-header{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:4px;
  }
  .home-header h1{font-size:26px;}
  .home-sub{
    font-size:14px;
    color:#8A7360;
    margin:0 0 28px 0;
  }
  .no-data{
    font-size:13px;
    color:#A8927A;
  }

  .menu-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:8px;
  }
  .menu-btn{
    background:var(--flour-card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
    text-align:left;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .menu-btn:active{transform:scale(.98);}
  .menu-btn.primary{
    background:var(--crust);
    border-color:var(--crust);
  }
  .menu-btn.primary .menu-btn-title{color:var(--flour);}
  .menu-btn.primary .menu-btn-desc{color:#D8C4AC;}
  .menu-btn:disabled{opacity:.45;cursor:default;}
  .menu-btn-title{
    font-size:16px;
    font-weight:700;
    color:var(--crust);
    margin-bottom:2px;
  }
  .menu-btn-desc{
    font-size:12.5px;
    color:#8A7360;
  }
  .menu-arrow{
    font-size:18px;
    color:var(--caramel);
    flex-shrink:0;
    margin-left:12px;
  }
  .menu-btn.primary .menu-arrow{color:var(--wheat);}

  .footer-note{
    margin-top:auto;
    padding-top:24px;
    font-size:11.5px;
    color:#B3A188;
    text-align:center;
    line-height:1.6;
  }

  /* ---------- 퀴즈 화면 ---------- */
  .quiz-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .quit-btn{
    background:none;
    border:none;
    font-size:20px;
    color:var(--crust);
    cursor:pointer;
    padding:4px 6px;
    line-height:1;
  }
  .progress-track{
    flex:1;
    height:8px;
    border-radius:5px;
    background:#F0E4CC;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--wheat), var(--caramel));
    border-radius:5px;
    transition:width .3s ease;
  }
  .progress-count{
    font-size:12.5px;
    font-weight:600;
    color:var(--caramel-dark);
    flex-shrink:0;
    min-width:40px;
    text-align:right;
  }
  .subject-tag{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    color:var(--caramel-dark);
    background:#F3E3C4;
    border-radius:999px;
    padding:4px 12px;
    margin-bottom:14px;
  }
  .question-text{
    font-family:'Gowun Batang', serif;
    font-size:19px;
    line-height:1.55;
    color:var(--charcoal);
    margin-bottom:16px;
  }
  .passage-box{
    background:#F3E9D6;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    font-size:14.5px;
    line-height:1.8;
    color:var(--crust);
    margin-bottom:18px;
    white-space:pre-wrap;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:18px;
  }
  .choice{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--flour-card);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    font-size:15px;
    text-align:left;
    color:var(--charcoal);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .choice-num{
    width:24px;
    height:24px;
    border-radius:50%;
    background:#F0E4CC;
    color:var(--crust);
    font-size:12.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .choice:active{background:#F5EBD8;}
  .choice.correct{
    background:var(--sage-bg);
    border-color:var(--sage);
  }
  .choice.correct .choice-num{background:var(--sage);color:#fff;}
  .choice.wrong{
    background:var(--jam-bg);
    border-color:var(--jam);
  }
  .choice.wrong .choice-num{background:var(--jam);color:#fff;}
  .choice.disabled{cursor:default;}
  .choice.dim{opacity:.5;}

  .feedback-box{
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:18px;
    display:none;
  }
  .feedback-box.show{display:block;animation:fadeIn .2s ease;}
  .feedback-box.correct{background:var(--sage-bg);}
  .feedback-box.wrong{background:var(--jam-bg);}
  .feedback-label{
    font-size:13.5px;
    font-weight:700;
    margin-bottom:6px;
  }
  .feedback-box.correct .feedback-label{color:#3F5A34;}
  .feedback-box.wrong .feedback-label{color:#7A2424;}
  .feedback-text{
    font-size:14px;
    line-height:1.6;
    color:var(--charcoal);
  }
  .feedback-divider{
    border:none;
    border-top:1px solid rgba(0,0,0,.1);
    margin:10px 0;
  }
  .feedback-explanation-label{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    margin-bottom:5px;
    opacity:.6;
  }
  .feedback-box.correct .feedback-explanation-label{color:#3F5A34;}
  .feedback-box.wrong   .feedback-explanation-label{color:#7A2424;}

  .next-btn{
    margin-top:auto;
    background:var(--crust);
    color:var(--flour);
    border:none;
    border-radius:14px;
    padding:16px;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
    display:none;
  }
  .next-btn.show{display:block;animation:fadeIn .2s ease;}
  .next-btn:active{background:var(--charcoal);}

  /* ---------- 결과 화면 ---------- */
  .result-hero{
    text-align:center;
    padding:12px 0 28px;
  }
  .result-score{
    font-family:'Gowun Batang', serif;
    font-size:52px;
    font-weight:700;
    color:var(--caramel);
    line-height:1;
  }
  .result-score span{font-size:22px;color:#B3A188;font-weight:400;}
  .result-caption{
    margin-top:10px;
    font-size:14px;
    color:#8A7360;
  }
  .result-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:20px;
  }
  .result-item{
    background:var(--flour-card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:13.5px;
  }
  .result-mark{
    flex-shrink:0;
    width:20px;
    height:20px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:700;
    color:#fff;
    margin-top:1px;
  }
  .result-mark.o{background:var(--sage);}
  .result-mark.x{background:var(--jam);}
  .result-item-text{color:var(--charcoal);line-height:1.5;}

  .result-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:auto;
  }

  /* ---------- set 카드 ---------- */
  .set-card{
    background:var(--flour-card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
    text-align:left;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:transform .12s ease;
  }
  .set-card:active{transform:scale(.98);}
  .set-card-info{flex:1;min-width:0;}
  .set-card-name{
    font-size:16px;
    font-weight:700;
    color:var(--crust);
    margin-bottom:6px;
  }
  .set-card-bar-wrap{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .set-bake-bar{
    flex:1;
    height:7px;
    border-radius:5px;
    background:#F0E4CC;
    overflow:hidden;
  }
  .set-bake-bar-fill{
    height:100%;
    border-radius:5px;
    background:linear-gradient(90deg, var(--wheat), var(--caramel));
    transition:width .5s ease;
  }
  .set-card-pct{
    font-size:12.5px;
    font-weight:600;
    color:var(--caramel-dark);
    flex-shrink:0;
    min-width:36px;
    text-align:right;
  }
  .set-card-count{
    font-size:12px;
    color:#A8927A;
    margin-top:3px;
  }

  /* ---------- 모달 ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(43,33,26,.45);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
    animation:fadeIn .2s ease;
  }
  .modal-box{
    background:var(--flour-card);
    border-radius:22px 22px 0 0;
    padding:28px 20px calc(28px + env(safe-area-inset-bottom));
    width:100%;
    max-width:480px;
  }
  .modal-title{
    font-family:'Gowun Batang', serif;
    font-size:19px;
    font-weight:700;
    color:var(--crust);
    margin-bottom:6px;
    text-align:center;
  }
  .modal-progress{
    font-size:13px;
    color:#8A7360;
    text-align:center;
    margin-bottom:20px;
  }
  .modal-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:10px;
  }
  .modal-btn{
    width:100%;
    background:var(--flour-card);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:15px;
    font-size:15.5px;
    font-weight:700;
    color:var(--crust);
    cursor:pointer;
    transition:background .12s ease;
  }
  .modal-btn.primary{
    background:var(--crust);
    border-color:var(--crust);
    color:var(--flour);
  }
  .modal-btn:disabled{
    opacity:.4;
    cursor:default;
  }
  .modal-btn:not(:disabled):active{opacity:.82;}
  .modal-close{
    width:100%;
    background:none;
    border:none;
    padding:12px;
    font-size:14px;
    color:#A8927A;
    cursor:pointer;
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===== 홈 화면 ===== -->
  <div id="screen-home" class="screen">
    <div class="home-header">
      <h1>🍞 민규 화이팅</h1>
    </div>
    <p class="home-sub">출퇴근길에 한번씩이라도 풀어보길 바라며..</p>

    <div id="set-list" class="menu-list"></div>

    <div class="menu-list" style="margin-top:16px;">
      <button class="menu-btn" id="btn-wrong">
        <div>
          <div class="menu-btn-title">틀린 문제만 다시 풀기</div>
          <div class="menu-btn-desc" id="wrong-desc">0문제 저장됨</div>
        </div>
        <span class="menu-arrow">›</span>
      </button>
    </div>

    <!-- set 선택 모달 -->
    <div id="set-modal-overlay" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="modal-title" id="modal-set-name"></div>
        <div class="modal-progress" id="modal-set-progress"></div>
        <div class="modal-actions">
          <button class="modal-btn primary" id="modal-btn-new">새로 풀기</button>
          <button class="modal-btn" id="modal-btn-continue">이어 풀기</button>
        </div>
        <button class="modal-close" id="modal-close">취소</button>
      </div>
    </div>

    <!-- 새로풀기 순서 선택 모달 -->
    <div id="order-modal-overlay" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="modal-title">문제 순서 선택</div>
        <div class="modal-actions">
          <button class="modal-btn primary" id="order-btn-random">🔀 랜덤으로 풀기</button>
          <button class="modal-btn" id="order-btn-original">📋 원래 순서로 풀기</button>
        </div>
        <button class="modal-close" id="order-close">취소</button>
      </div>
    </div>

    <p class="footer-note">진행 상황은 이 기기의 브라우저에만 저장돼요.<br>홈 화면에 추가해두면 앱처럼 쓸 수 있어요.</p>
  </div>

  <!-- ===== 퀴즈 화면 ===== -->
  <div id="screen-quiz" class="screen hidden">
    <div class="quiz-top">
      <button class="quit-btn" id="btn-quit" aria-label="홈으로">←</button>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-count" id="progress-count">1/10</div>
    </div>

    <span class="subject-tag" id="subject-tag">과목</span>
    <div class="question-text" id="question-text">문제 텍스트</div>
    <div class="passage-box hidden" id="passage-box"></div>

    <div class="choices" id="choices"></div>

    <div class="feedback-box" id="feedback-box">
      <div class="feedback-label" id="feedback-label"></div>
      <hr class="feedback-divider">
      <div class="feedback-explanation-label">해설</div>
      <div class="feedback-text" id="feedback-text"></div>
    </div>

    <button class="next-btn" id="btn-next">다음 문제</button>
  </div>

  <!-- ===== 결과 화면 ===== -->
  <div id="screen-result" class="screen hidden">
    <div class="result-hero">
      <div class="result-score"><span id="result-total-label"></span></div>
      <div class="result-caption" id="result-caption"></div>
    </div>
    <div class="result-list" id="result-list"></div>
    <div class="result-actions">
      <button class="menu-btn primary" id="btn-result-home">
        <div><div class="menu-btn-title">홈으로</div></div>
        <span class="menu-arrow">›</span>
      </button>
    </div>
  </div>

</div>

<script>
// 제과산업기사 기출복원문제
// 스키마: { id, set, subject, question, passage(선택), choices, answer, explanation }
// set: 시험 회차 (예: "3회")
// subject: 과목명 (추후 입력)
// answer: choices 배열의 인덱스 (0부터 시작)

const QUESTIONS = [
  { id: "2024-round1-001", set: "2024 1회", subject: "2024 1회", question: "퍼프 페이스트리 굽기 중 유지가 흘러내리는 원인이 아닌 것은?", choices: ["높은 온도에서 반죽을 휴지할 때", "밀어 펴기와 접기가 부족할 때", "높은 온도의 철판과 오븐을 사용할 때", "달걀물칠이 과도할 때"], answer: 3, explanation: "퍼프 페이스트리를 굽는 동안 유지가 흘러나오는 원인으로는 부적절한 밀어 펴기, 박력분 사용, 지나치게 높거나 낮은 오븐 온도, 오래된 반죽 사용 등이다." },
  { id: "2024-round1-002", set: "2024 1회", subject: "2024 1회", question: "제과 제조 공정에서 일어나는 현상에 대한 설명 중 틀린 것은?", choices: ["캐러멜화 반응: 단백질이 높은 온도로 가열되어 갈색의 캐러멜을 만드는 현상", "메일라드 반응: 단백질, 아미노산, 환원당이 열에 의해 멜라노이딘이라는 갈색 색소를 형성하는 현상", "전분의 호화: 전분이 수분과 열에 의해 점성이 있는 상태로 변하는 현상", "전분의 노화: 전분에서 수분이 배출되어 과자의 식감을 딱딱하게 만드는 현상"], answer: 0, explanation: "캐러멜화는 당류가 일으키는 산화·갈변 반응이며 단백질이 포함되지 않은 당류에서 발생한다. 나 이거 알아 탕후루 만들다 시럽 좀 더 끓이면 이렇게 되자나ㅋ" },
  { id: "2024-round1-007", set: "2024 1회", subject: "2024 1회", question: "유지의 특성으로 옳은 것은?", choices: ["가소성은 제품의 부드러운 정도를 나타낸다.", "안정성은 유지가 상온에서 고체 모양을 유지하는 성질이다.", "쇼트닝성은 지방의 산화와 산패를 장기간 억제하는 성질이다.", "크림성은 유지가 믹싱 조작 중 공기를 포집하는 능력이다."], answer: 3, explanation: "가소성 - 유지가 상온에서 너무 단단하지 않으면서 고체 모양을 유지하는 성질///안정성 - 지방의 산화와 산패가 장기간 억제하는 성질///쇼트닝성 - 빵 과자 제품에 부드러움을 주는 성질, 버터나 쇼트닝이 많이 가지고 있는 성질" },
  { id: "2024-round1-010", set: "2024 1회", subject: "2024 1회", question: "퍼프 페이스트리 반죽의 설명으로 틀린 것은?", choices: ["반죽에 쌓인 유지가 팽창하면서 부피를 얻는다.", "층을 만들기 위해 발효실에서 충분히 발효해야 한다.", "반죽 온도는 20℃가 적당하다.", "밀어 펴기 과정에서 글루텐의 휴식을 충분히 시켜야 한다."], answer: 1, explanation: "퍼프 페이스트리 반죽에는 이스트가 들어가지 않으므로 발효시키지 않는다." },
  { id: "2024-round1-016", set: "2024 1회", subject: "2024 1회", question: "파이의 제조 공정에 대한 설명으로 틀린 것은?", choices: ["파이는 주로 200~220℃의 고온으로 굽는다.", "버터 대신 롤인마가린을 사용할 수 있다.", "파이 반죽은 최종 단계까지 믹싱을 충분히 한다.", "0℃의 냉장고에서 보관한 버터를 사용한다."], answer: 2, explanation: "파이 반죽은 글루텐이 생성되기 전인 픽업 단계까지만 믹싱한다." },
  { id: "2024-round1-017", set: "2024 1회", subject: "2024 1회", question: "별립법으로 케이크 제조 시 기포 형성 과정에 대한 설명으로 옳은 것은?", choices: ["전란에 설탕을 넣어 기포를 형성한다.", "달걀 흰자와 노른자에 설탕을 각각 넣어 기포를 형성한다.", "달걀에 설탕과 나머지 원료를 넣어 기포를 형성한다.", "유지에 설탕을 넣어 기포를 형성한다."], answer: 1, explanation: "별립법은 흰자와 노른자에 각각 설탕을 넣어 거품을 형성한 다음 섞어 반죽을 완성한다." },
  { id: "2024-round1-026", set: "2024 1회", subject: "2024 1회", question: "도넛의 설탕이 수분을 흡수하여 녹는 현상을 방지하기 위한 방법으로 잘못된 것은?", choices: ["스테아린 경화제를 첨가한다.", "냉각 중 환기가 잘 되도록 하며 식힌다.", "도넛 위에 뿌리는 설탕 사용량을 늘린다.", "튀기는 시간을 늘려 수분 함량을 줄인다."], answer: 0, explanation: "스테아린은 도넛 기름이 설탕을 적시는 황화 현상의 대책이며, 설탕이 수분에 녹는 발한 현상의 대책은 아니다. 아니 설명을 왜케 맛있게 해놔써 군침돌게" },
  { id: "2024-round1-027", set: "2024 1회", subject: "2024 1회", question: "코코아 매스에서 코코아 버터를 제거한 다음 식물성 유지와 설탕을 첨가해 템퍼링 작업 없이 사용할 수 있는 장점을 가진 초콜릿은?", choices: ["커버추어", "밀크 초콜릿", "가나슈용 초콜릿", "파타글라세"], answer: 3, explanation: "파타글라세는 식물성 유지와 설탕을 첨가해 템퍼링 없이 녹여 바로 사용할 수 있다. 파타글라세는 빠떼아글라세라고도 한다. 나는 뭔가 어감이 더 세서 빠떼아글라세가 더 마음에 드네ㅋ" },
  { id: "2024-round1-030", set: "2024 1회", subject: "2024 1회", question: "대규모 베이커리 매장의 신입사원 채용 시 외부모집의 단점이 아닌 것은?", choices: ["안정을 위한 적응기간 소요", "조직의 폐쇄성 강화", "내부 인력의 승진 기회 축소", "부족한 정보로 인한 부적격자 채용의 위험성"], answer: 1, explanation: "외부모집은 다양한 인력 활용과 유연성 강화, 긍정적 소통 등으로 조직의 폐쇄성을 약화시킨다. 당연하겠지요? (민규 : 네~~)" },
  { id: "2024-round1-031", set: "2024 1회", subject: "2024 1회", question: "퍼프 페이스트리가 굽기 후 수축하는 원인이 아닌 것은?", choices: ["유지 사용량이 부족", "너무 낮은 오븐온도", "굽기 전 휴지 불충분", "반죽이 너무 단단함"], answer: 1, explanation: "퍼프 페이스트리는 너무 낮은 온도가 아니라 너무 높은 오븐 온도에서 수축할 수 있다." },
  { id: "2024-round1-032", set: "2024 1회", subject: "2024 1회", question: "다음 중 휘핑 제조 시 일반적으로 오버런이 가장 좋은 크림은?", choices: ["생크림", "식물성 크림", "콤파운드 크림", "커피 크림"], answer: 1, explanation: "오버런은 휘핑, 냉동 등으로 인해 공기 혼합물이 공기 혼입에 의하여 믹스의 용적이 증가하여 부피가 증가하는 현상으로 증용률이라 한다. 오버런은 식물성 크림이 가장 크다. 호오 뭔소린지는 모르겠지만 저을수록 더 잘 부푸는 애들이 증용률이 크다고 하나봐여??" },
  { id: "2024-round1-034", set: "2024 1회", subject: "2024 1회", question: "단순 아이싱(flat icing) 제조 시 재료가 아닌 것은?", choices: ["분당", "달걀", "물", "물엿"], answer: 1, explanation: "단순 아이싱은 분당, 물, 물엿, 향을 섞어 가열해 만든다. 아잇 이건 좀 너무하네 이건 나도 알겠다" },
  { id: "2024-round1-035", set: "2024 1회", subject: "2024 1회", question: "반죽형 케이크의 부드러운 성질(유연성)에 가장 크게 영향을 미치는 요인은?", choices: ["쇼트닝 함량", "밀가루 함량", "달걀 함량", "수분 함량"], answer: 0, explanation: "쇼트닝은 케이크가 굳어지는 것을 방지하고 수분을 유지해 부드러움에 가장 큰 영향을 준다." },
  { id: "2024-round1-038", set: "2024 1회", subject: "2024 1회", question: "베이킹파우더를 넣지 않고 파운드 케이크를 제조할 경우 품질평가로 틀린 것은?", choices: ["반죽이 가볍고 부드럽다.", "제품의 부피가 작다.", "부풀리는 힘이 부족하다.", "식감이 단단하다."], answer: 0, explanation: "베이킹파우더를 넣지 않으면 부피가 작고 팽창력이 부족하며 식감이 단단해진다. 양심고백하자면 이거 책에는 설명이 좀 길게 나와있는데 지피티가 지맘대로 설명 이렇게 줄여놨는데 내 생각에 오빠는 실무자라서 설명 안 읽어도 잘 알지 않을까? 하는 생각에 그냥 설명 안 옮겨적을래.. 절대 귀찮아서 아님.. 그리고 이렇게 길게 적을 생각 없었는데 뻘소리 길게 적지 말고 걍 책 설명이나 옮겨적을걸 후회되네 궁금하면 책으로 확인해라 강민규!" },
  { id: "2024-round1-040", set: "2024 1회", subject: "2024 1회", question: "화이트 레이어 케이크의 제조 시 흰자 거품을 강하게 하기 위하여 사용되는 재료는?", choices: ["탄산수소나트륨", "유화쇼트닝", "중조", "주석산 크림"], answer: 3, explanation: "주석산 크림은 흰자의 알칼리성을 중화하고 거품을 강하게 하며 머랭 색상을 희게 한다." },
  { id: "2024-round1-044", set: "2024 1회", subject: "2024 1회", question: "시폰 케이크의 제조 과정에 대한 설명으로 틀린 것은?", choices: ["달걀 흰자에 설탕을 넣고 기포를 형성한다.", "흰자의 거품이 형성되면 주석산 크림을 넣고 중간 피크의 머랭을 만든다.", "노른자에 오일, 물, 밀가루를 혼합한다.", "흰자 머랭에 노른자를 혼합 후 나머지 물과 밀가루를 혼합한다."], answer: 3, explanation: "시폰 케이크는 시폰법으로 제조한다. 쉬폰법은 거품형 반죽으로 흰자, 노른자를 분리하긴 하지만, 흰자는 거품을 내주고 노른자는 거품을 내지 않고 잘 섞어주는 방법을 말한다. 노른자, 식용유, 설탕+소금, 물 순서로 섞은 후, 밀가루를 섞고 머랭을 나누어 섞어 비중 0.45 정도의 반죽을 완성한다." },
  { id: "2024-round1-046", set: "2024 1회", subject: "2024 1회", question: "자연적인 냉각으로 포장에 적합한 빵 내부 온도는?", choices: ["35~40℃", "5~10℃", "25~30℃", "15~20℃"], answer: 0, explanation: "냉각된 제품의 빵 내부 온도는 35~40℃이며 수분함량은 약 38%이다." },
  { id: "2024-round1-048", set: "2024 1회", subject: "2024 1회", question: "과자의 냉각 시 영향을 미치는 요소 중 환경 요인이 아닌 것은?", choices: ["습도", "냉각 기구", "시간", "온도"], answer: 2, explanation: "환경 요인에는 온도, 습도, 공기 흐름, 냉각 방법, 위생 상태 등이 있으며 시간은 환경 요인이 아니다." },
  { id: "2024-round1-049", set: "2024 1회", subject: "2024 1회", question: "아몬드 타르트 제조 공정에 대한 설명으로 틀린 것은?", choices: ["팬이 작을 경우 휴지시킨 반죽을 손으로 봉합하여 팬에 눌러 평평하게 할 수 있다.", "반죽을 두께 3mm 정도로 밀어 편 뒤 포크로 작은 구멍을 만들어 타르트 용기에 넣는다.", "아몬드 크림은 짤주머니에 담아 충전한다.", "타르트 반죽은 파이와 같이 최종 단계까지 반죽하여 상온에서 휴지 후 정형한다."], answer: 3, explanation: "타르트 반죽은 픽업 단계까지만 반죽하고 냉장 휴지 후 정형한다. 타르트 껍질은 글루텐이 형성되지 않도록 반죽하고 냉장 휴지해야 바삭한 껍질을 만들 수 있다." },
  { id: "2024-round1-052", set: "2024 1회", subject: "2024 1회", question: "포장 재료의 조건이 아닌 것은?", choices: ["유해 물질이 함유되지 않고 위생적이어야 한다.", "포장 후 상품 가치를 높일 수 있어야 한다.", "수분 증발을 조절할 수 있도록 통기성이 약해야 한다.", "포장 비용이 경제적이어야 한다."], answer: 2, explanation: "포장 재료는 방수성이 있고 통기성이 없어야 하며, 통기성이 있으면 향과 수분이 증발해 품질이 저하된다. 우우 너무 쉽다 우우" },
  { id: "2024-round1-053", set: "2024 1회", subject: "2024 1회", question: "반죽 중 반죽을 호화시킨 다음 달걀을 넣어 완성시키는 품목은?", choices: ["파이", "타르트", "슈", "밤과자"], answer: 2, explanation: "슈는 반죽을 완전히 호화시킨 다음 달걀을 나누어 넣어 되기를 조절한다. 내가 알기로 슈는 아바타스타인데ㅋ 막이래~" },
  { id: "2024-round1-057", set: "2024 1회", subject: "2024 1회", question: "초콜릿 제품의 원료가 되는 비터 초콜릿 4kg에 들어있는 카카오버터의 함량은 얼마인가?", choices: ["0.5kg", "1.5kg", "2.5kg", "3.5kg"], answer: 1, explanation: "비터 초콜릿은 카카오 5/8과 카카오버터 3/8로 이루어져 4kg×3/8=1.5kg이다." },
  { id: "round2-001", set: "2024 2회", subject: "2024 2회", question: "슈 공정 중에서 잘못된 것은?", choices: ["물 + 소금 + 유지를 넣고 센불로 끓인다.", "팽창제(베이킹파우더 등)를 넣을 경우 달걀 넣기 전에 넣는다.", "처음엔 아랫불을 높여 굽다가 충분히 팽창하고 표피가 터지면 아랫불을 줄이고 윗불을 높여 굽는다.", "슈가 주저앉을 수 있으므로 팽창 중에 문을 자주 열지 않는다."], answer: 1, explanation: "팽창제를 넣는 경우 마지막에 넣는다." },
  { id: "round2-002", set: "2024 2회", subject: "2024 2회", question: "별립법에 대한 설명으로 옳지 않은 것은?", choices: ["달걀을 노른자와 흰자로 분리한 후 거품 낸다.", "노른자와 식용유를 넣고 섞은 후, 설탕을 넣고 녹인다.", "흰자와 흰자용 설탕을 이용하여 머랭을 올려 사용한다.", "비중은 0.5 내외이다."], answer: 1, explanation: "쉬폰법은 노른자와 식용유를 섞은 후 설탕과 물을 넣고 녹인다." },
  { id: "round2-003", set: "2024 2회", subject: "2024 2회", question: "롤 케이크를 말 때 표면의 터짐을 방지하는 방법이 아닌 것은?", choices: ["설탕의 일부를 물엿이나 시럽으로 대체한다.", "노른자 양을 줄이고 전란의 양을 증가시킨다.", "낮은 온도에서 천천히 오래 굽는다.", "밑불이 너무 높지 않게 굽는다."], answer: 2, explanation: "롤 케이크는 낮은 온도에서 오래 굽지 않는다." },
  { id: "round2-004", set: "2024 2회", subject: "2024 2회", question: "아몬드 타르트 제조 방법이 잘못된 것은?", choices: ["반죽법은 크림법으로 제조한다.", "껍질은 글루텐이 형성되지 않도록 반죽하고 냉장 휴지한다.", "크림을 너무 많이 짜지 않는다.", "바닥 껍질은 5mm 정도로 밀어 틀 안쪽으로 끝까지 밀어줘야 수축을 방지할 수 있다."], answer: 3, explanation: "바닥 껍질은 2~3mm 정도가 적당하다." },
  { id: "round2-005", set: "2024 2회", subject: "2024 2회", question: "페이스트리 반죽을 굽는 과정에서 수축의 원인이 아닌 것은?", choices: ["휴지를 충분히 하지 않은 경우", "과도한 밀어 펴기를 한 경우", "반죽이 진 경우", "덧가루를 많이 사용한 경우"], answer: 2, explanation: "휴지 부족, 과도한 밀어 펴기, 된 반죽은 성형 후 수축의 원인이다." },
  { id: "round2-007", set: "2024 2회", subject: "2024 2회", question: "다음 머랭 중 설탕이 가장 적게 들어가는 머랭은?", choices: ["프렌치 머랭", "스위스 머랭", "이탈리안 머랭", "코코넛 머랭"], answer: 0, explanation: "프렌치 머랭의 흰자와 설탕 비율은 1:1로 가장 적다." },

  { id: "round3-012", set: "2024 3회", subject: "", question: "쿠키 중 가장 수분이 많은 쿠키는?", choices: ["쇼트 브레드 쿠키", "버터 쿠키", "아이싱 쿠키", "핑거 쿠키"], answer: 3, explanation: "핑거 쿠키는 거품형 쿠키로 공립법으로 제조한다." },
  { id: "round3-013", set: "2024 3회", subject: "", question: "머랭 중 설탕이 적은 것은?", choices: ["프렌치 머랭", "스위스 머랭", "이탈리안 머랭", "온제 머랭"], answer: 0, explanation: "프렌치 머랭의 흰자와 설탕 비율은 1:1로, 다른 머랭보다 설탕 비율이 낮다." },
  { id: "round3-018", set: "2024 3회", subject: "", question: "반죽형 반죽 중 단단계법의 특징이 아닌 것은?", choices: ["설탕을 많이 사용하는 공장에 유리하다.", "믹싱 방법과 특징을 잘 알아야 한다.", "유화제와 베이킹파우더를 넣어 반죽한다.", "모든 재료를 한 번에 투입한 후 믹싱한다."], answer: 0, explanation: "단단계법은 모든 재료를 한 번에 넣어 반죽하여 노동력과 시간이 절약되지만 설탕을 많이 사용하는 공장에 유리한 방법은 아니다." },
  { id: "round3-025", set: "2024 3회", subject: "", question: "슈 제조 공정 중 잘못된 것은?", choices: ["밀가루를 호화시킨 후 즉시 달걀 전량을 넣는다.", "슈 반죽을 짠 후 분무하거나 물을 붓고 침지 후 물을 따라 버리고 굽는다.", "굽기 과정 중 가급적 문을 열지 않고 굽는다.", "슈 반죽의 되기는 달걀로 조절한다."], answer: 0, explanation: "반죽이 너무 뜨거우면 달걀이 익을 수 있으므로 조금 식혀 60℃ 이하에서 달걀을 넣는다." },
  { id: "round3-028", set: "2024 3회", subject: "", question: "반죽에 베이킹파우더를 많이 사용한 경우의 문제점이 아닌 것은?", choices: ["밀도가 높고 부피가 크다.", "속색이 어둡고 맛에는 쓴맛이 난다.", "속결이 거칠고 빨리 건조되어 노화가 빠르게 진행된다.", "오븐 스프링이 과도하여 찌그러질 수 있다."], answer: 0, explanation: "베이킹파우더를 많이 사용하면 팽창이 과도하여 밀도가 낮아지고 부피가 커진다." },
  { id: "round3-031", set: "2024 3회", subject: "", question: "다크 초콜릿 템퍼링 순서와 온도가 옳지 않은 것은?", choices: ["1단계: 초콜릿을 49℃ 정도로 녹여 카카오버터의 결정화를 부순다.", "2단계: 25℃ 정도로 내려 결정화가 신속하게 진행되도록 한다.", "3단계: 31℃ 정도로 온도를 다시 올려 안정적인 결합이 되도록 한다.", "4단계: 작업 진행 중 초콜릿이 다시 굳어지지 않도록 적정한 온도를 유지한다."], answer: 1, explanation: "다크 초콜릿의 템퍼링 2단계 온도는 약 27℃가 적당하다." },
  { id: "round3-035", set: "2024 3회", subject: "", question: "오버런(Over-run)이 가장 큰 크림은?", choices: ["콤파운드 버터", "식물성 생크림", "동물성 생크림", "식용유"], answer: 1, explanation: "유지방 함량이 적을수록 오버런이 높으며 식물성 생크림의 오버런이 가장 크고 안정적이다." },
  { id: "round3-037", set: "2024 3회", subject: "", question: "페이스트리 제조 시 주의할 점이 아닌 것은?", choices: ["반죽과 충전용 유지 온도는 동일해야 한다.", "밀어 펴기 시 덧가루를 많이 사용해야 한다.", "2차 발효실 온도는 충전용 유지의 융점보다 낮아야 한다.", "발효가 지나치면 굽기 중 유지가 층으로부터 새어 나온다."], answer: 1, explanation: "과도한 덧가루는 결을 단단하게 하고 제품이 부서지기 쉬우므로 소량만 사용한다." },
  { id: "round3-041", set: "2024 3회", subject: "", question: "도넛을 튀길 때 발한 현상에 대한 대책으로 잘못된 것은?", choices: ["도넛에 묻히는 설탕량을 증가시킨다.", "튀김 시간을 늘려 도넛의 수분 함량을 줄인다.", "도넛 반죽의 되기를 질게 한다.", "도넛을 40℃ 정도로 식혀 설탕을 묻힌다."], answer: 2, explanation: "도넛 반죽이 질면 발한 현상이 더 커진다." },
  { id: "round3-042", set: "2024 3회", subject: "", question: "파이 반죽 제조 시 충전물의 노화방지제에 대한 설명으로 틀린 것은?", choices: ["호화를 빠르게 진행시킨다.", "광택, 색, 향을 유지시킨다.", "냉각 후 농도를 유지시킨다.", "노화방지제로 주로 설탕을 사용한다."], answer: 3, explanation: "파이의 노화방지제로는 달걀, 전분 등을 사용한다." },
  { id: "round3-045", set: "2024 3회", subject: "", question: "커스터드 크림의 주요 재료에 속하지 않는 것은?", choices: ["버터", "달걀", "전분", "설탕"], answer: 0, explanation: "커스터드 크림은 우유, 설탕, 달걀을 혼합하고 전분이나 박력분을 안정제로 사용해 끓인 크림이다." },
  { id: "round3-046", set: "2024 3회", subject: "", question: "아몬드 스펀지 케이크 제조 공정에 대한 설명 중 잘못된 것은?", choices: ["달걀을 중탕으로 충분히 거품 내고 설탕을 섞는다.", "체 친 아몬드 가루와 밀가루를 섞는다.", "비중은 0.5 정도가 적당하다.", "팬닝 후 180℃에서 30분 정도 굽는다."], answer: 0, explanation: "더운 공립법으로 중탕할 때는 달걀과 설탕, 소금을 섞어 약 43℃로 따뜻하게 중탕한다." },
  { id: "round3-057", set: "2024 3회", subject: "", question: "크림법 반죽에 대한 설명으로 잘못된 것은?", choices: ["비중이 가볍고 조직이 부드럽다.", "화학적 팽창제를 사용한다.", "유지와 설탕의 사용량이 많다.", "비교적 굽는 시간이 길다."], answer: 0, explanation: "크림법은 비중이 무겁고 화학적 팽창제를 사용하며 유지, 설탕, 달걀, 밀가루 함량이 많고 굽는 시간도 긴 편이다." },
  { id: "round3-058", set: "2024 3회", subject: "", question: "스펀지 케이크 제조 시 달걀 사용량이 16% 감소했다면 밀가루 사용의 변화는?", choices: ["2%", "3%", "4%", "5%"], answer: 2, explanation: "달걀 16%의 고형분은 4%이므로 밀가루 4%로 대체할 수 있다." },
  { id: "2024-round4-005", set: "2024 4회", subject: "2024 4회", question: "박력분의 특성에 대한 설명 중 옳은 것은?", choices: ["반죽 혼합 시 흡수율이 높다.", "다목적으로 사용되며 반죽 형성 시간이 빠르다.", "밀가루 입자가 가장 크다.", "연질소맥을 제분한다."], answer: 3, explanation: "박력분은 연질소맥을 제분하여 얻고 입자와 입자의 결합력이 약한 편이다. 강력분과 달리 반죽 형성 시간이 짧고 흡수율은 낮다." },
  { id: "2024-round4-006", set: "2024 4회", subject: "2024 4회", question: "초콜릿 보관 시 설탕 블룸(Sugar Bloom) 현상이 발생했다면 가장 큰 원인은 무엇인가?", choices: ["온도", "직사광선", "수분", "압력"], answer: 2, explanation: "슈가 블룸(Sugar Bloom)은 초콜릿의 설탕이 공기 중 수분과 접촉하여 녹았다가 재결정화되면서 표면에 하얗게 되는 현상으로, 초콜릿이 높은 곳에 보관된 경우에 발생한다." },
  { id: "2024-round4-007", set: "2024 4회", subject: "2024 4회", question: "반죽 중 반죽을 휴지시킨 다음 달걀을 넣어 완성시키는 품목은?", choices: ["파이", "타르트", "슈", "밤과자"], answer: 2, explanation: "슈 제조 방법은 반죽을 완전히 호화시킨 다음 계란을 나눠 넣으면서 되기를 조절해 만든다." },
  { id: "2024-round4-008", set: "2024 4회", subject: "2024 4회", question: "퍼프 페이스트리가 굽기 후 수축하는 원인이 아닌 것은?", choices: ["유지 사용량이 부족", "너무 낮은 오븐온도", "굽기 전 휴지 불충분", "반죽이 너무 단단함"], answer: 1, explanation: "퍼프 페이스트리가 수축하는 원인은 너무 낮은 오븐 온도가 아니라 너무 높은 오븐 온도일 때 수축이 일어난다." },
  { id: "2024-round4-013", set: "2024 4회", subject: "2024 4회", question: "과자의 냉각 시 영향을 미치는 요소 중 환경 요인이 아닌 것은?", choices: ["습도", "냉각 기구", "시간", "온도"], answer: 2, explanation: "과자의 냉각 과정에서 환경 요인은 품질과 식감에 중요한 영향을 미칠 수 있다. 환경 요인으로는 온도, 습도, 공기 흐름, 냉각 방법 등이 있다. 시간은 환경 요인에 속하지 않는다." },
  { id: "2024-round4-014", set: "2024 4회", subject: "2024 4회", question: "가공유지인 마가린에 대한 설명으로 틀린 것은?", choices: ["융점이 28~36℃가 되도록 배합한다.", "마가린은 수중 유지형 유화 형태를 갖는 제품군이다.", "시장 환경에 따라 다양한 제품군이 있으며 통상 80% 정도이다.", "유지의 원료로 동물성 유지와 식물성 유지가 모두 사용될 수 있다."], answer: 1, explanation: "가공유지는 자연 상태의 지방을 화학적 또는 물리적 방법으로 변형시키거나 다른 식품의 원료로 사용하는 지방 제품이다. 마가린은 물에 기름이 분산된 수중 유지형이 아니라 기름 속에 물이 분산된 유지 중 수형(water-in-oil) 유화액이다. 식품 중 수중 유지형은 우유·마요네즈·아이스크림이 있고, 유지 중 수형에는 버터와 마가린이 있다." },
  { id: "2024-round4-016", set: "2024 4회", subject: "2024 4회", question: "빈칸에 알맞은 내용으로 맞는 것은? 설탕물에 녹아 있는 설탕의 무게를 물로 표시한 수치는 ( )이다.", choices: ["변형당", "액체의 당도", "가수분해", "상대량"], answer: 1, explanation: "당도란 물질의 수분 또는 용액 속에 녹아 있는 용질 상태의 당을 말하며, 설탕을 백분율로 표시한 것이다. 식품의 당도는 설탕물에 녹아 있는 설탕의 무게를 전체 물의 무게로 나눈 뒤 100을 곱해 표시할 수 있다." },
  { id: "2024-round4-017", set: "2024 4회", subject: "2024 4회", question: "과자류 제품 제조 시 주성분이 탄수화물인 재료를 높은 온도에서 가열할 때 발생할 수 있는 유해 물질은?", choices: ["트리할로메탄(Trihalomethane)", "니트로사민(Nitrosamine)", "벤조피렌(Benzopyrene)", "아크릴아마이드(Acrylamide)"], answer: 3, explanation: "아크릴아마이드는 아미노산과 환원당이 일으키는 마이야르 반응 과정에서 생기는 발암물질이다. 탄수화물이 많이 함유된 음식을 120℃ 이상으로 가열할 때 아스파라긴과 포도당이 반응해 만들어진다. 아크릴아마이드는 단백질에 비해 탄수화물 함유량이 높은 음식을 조리하는 과정에서 많이 생성된다." },
  { id: "2024-round4-018", set: "2024 4회", subject: "2024 4회", question: "시퐁 케이크의 제조 과정에 대한 설명으로 틀린 것은?", choices: ["달걀 흰자에 설탕을 넣고 기포를 형성한다.", "흰자의 기포가 형성되면 주석산 크림을 넣고 중간 피크의 머랭을 만든다.", "노른자에 오일, 물, 밀가루를 혼합한다.", "흰자 머랭에 노른자를 혼합 후 나머지 물과 밀가루를 혼합한다."], answer: 3, explanation: "시퐁 케이크의 제조 방법은 시퐁법으로 제조한다. 시퐁법은 거품형 반죽으로 흰자·노른자를 분리하고 흰자는 설탕을 세 번에 나눠 노른자는 거품을 내지 않고 잘 섞어주는 방법이다. 노른자에 식용유·물·밀가루를 혼합한 후 흰자 머랭을 세 번에 나누어 섞어 비중 0.45 정도의 반죽을 완성한다." },
  { id: "2024-round4-020", set: "2024 4회", subject: "2024 4회", question: "별립법으로 케이크 제조 시 기포 형성 과정에 대한 설명으로 옳은 것은?", choices: ["전란에 설탕을 넣어 기포를 형성한다.", "달걀 흰자와 노른자에 설탕을 각각 넣어 기포를 형성한다.", "달걀에 설탕과 나머지 원료를 넣어 기포를 형성한다.", "유지에 설탕을 넣어 기포를 형성한다."], answer: 1, explanation: "별립법은 흰자와 노른자에 각각 설탕을 넣고 기포를 형성한 다음 섞어서 반죽을 완성한다." },
  { id: "2024-round4-022", set: "2024 4회", subject: "2024 4회", question: "전분의 가수분해 과정으로 옳은 것은?", choices: ["전분 → 덱스트린 → 맥아당 → 포도당", "전분 → 맥아당 → 덱스트린 → 과당", "전분 → 자당 → 맥아당 → 덱스트린", "전분 → 포도당 → 덱스트린 → 유당"], answer: 0, explanation: "전분이 가수분해되는 과정에서 작용하는 효소의 종류는 α-아밀라아제, β-아밀라아제, 말타아제, 자이마제가 있다. 전분의 가수분해 과정은 전분 → 덱스트린 → 맥아당 → 포도당 → CO₂, 알코올, 열이다." },
  { id: "2024-round4-023", set: "2024 4회", subject: "2024 4회", question: "포장 재료의 조건이 아닌 것은?", choices: ["유해 물질이 함유되지 않고 위생적이어야 한다.", "포장 후 상품 가치를 높일 수 있어야 한다.", "습도 영향을 조절할 수 있도록 통기성이 없어야 한다.", "포장 비용이 경제적이어야 한다."], answer: 2, explanation: "포장 재료는 산소와 곰팡이 침입을 막을 수 있어야 하고, 포장재에 의해서 모양이 유지되어야 하며 단가가 낮아야 한다. 포장 시 상품성 가치를 높일 수 있어야 하고, 통수성이 있고 통기성이 없어야 한다. 통기성이 있는 재료로 싸면 빵의 향이 날아가고 산소가 침투되어 노화를 촉진한다." },
  { id: "2024-round4-025", set: "2024 4회", subject: "2024 4회", question: "다음 중 필수아미노산이 아닌 것은?", choices: ["라이신", "메티오닌", "트레오닌", "알라닌"], answer: 3, explanation: "필수아미노산은 발린, 루신, 이소루신, 메티오닌, 트레오닌, 라이신, 페닐알라닌, 트립토판의 8종류가 있다. 어린이의 경우 히스티딘과 아르기닌도 필수아미노산에 추가로 포함된다." },
  { id: "2024-round4-026", set: "2024 4회", subject: "2024 4회", question: "지연적인 냉각으로 포장에 적합한 빵 내부 온도는?", choices: ["35~40℃", "5~10℃", "25~30℃", "15~20℃"], answer: 0, explanation: "냉각된 제품의 빵 내부 온도는 온도 35~40℃이며 수분 함량은 약 38%이다." },
  { id: "2024-round4-027", set: "2024 4회", subject: "2024 4회", question: "베이킹파우더를 넣지 않고 파운드 케이크를 제조한 경우 품질 평가로 틀린 것은?", choices: ["반죽이 가볍고 부드럽다.", "제품의 부피가 작다.", "부풀리는 힘이 부족하다.", "식감이 단단하다."], answer: 0, explanation: "베이킹파우더는 주로 과자를 만들 때 가열과 수분에 의해 생성되는 탄산이나 암모니아 가스로 반죽을 팽창시키는 화학적 팽창제이다. 베이킹파우더를 넣지 않을 경우 부피가 작고 부풀리는 힘이 부족하며 식감이 단단하다. 반죽이 가볍고 부드러운 경우는 베이킹파우더를 넣었을 때 일어나는 현상이다." },
  { id: "2024-round4-030", set: "2024 4회", subject: "2024 4회", question: "단순 아이싱(flat icing) 제조 시 재료가 아닌 것은?", choices: ["분당", "달걀", "물", "물엿"], answer: 1, explanation: "단순 아이싱이란 분당, 물, 물엿, 향을 섞어 43℃로 가열해 만드는 것을 말한다." },
  { id: "2024-round4-037", set: "2024 4회", subject: "2024 4회", question: "아몬드 타르트 제조 공정에 대한 설명으로 틀린 것은?", choices: ["팬이 작을 경우 휴지시킨 반죽을 손으로 성형하여 팬에 눌러 성형할 수 있다.", "반죽을 두께 3mm 정도로 밀어 편 뒤 포크로 작은 구멍을 만들어 타르트 용기에 넣는다.", "아몬드 크림은 짤주머니에 담아 충전한다.", "타르트 반죽은 파이와 같이 최종 단계까지 반죽하며 반죽이 된 후 정형한다."], answer: 3, explanation: "타르트 반죽은 파이와 같이 픽업 단계까지만 반죽하여 냉장 휴지 후 성형한다. 타르트 반죽은 글루텐이 형성되지 않도록 반죽하고 냉장 휴지해야 바삭한 질감을 만들 수 있다." },
  { id: "2024-round4-041", set: "2024 4회", subject: "2024 4회", question: "퍼프 페이스트리 반죽의 설명으로 틀린 것은?", choices: ["반죽에 쌓인 유지가 팽창하면서 부피를 얻는다.", "층을 만들기 위해 발효실에서 충분히 발효해야 한다.", "반죽 온도는 20℃가 적당하다.", "밀어펴기 과정에서 글루텐의 휴식을 충분히 시켜야 한다."], answer: 1, explanation: "퍼프 페이스트리 중 반죽을 시켜서 만드는 페이스트리는 데니시 페이스트리이다. 퍼프 페이스트리 반죽에는 이스트가 들어가지 않는다." },
  { id: "2024-round4-043", set: "2024 4회", subject: "2024 4회", question: "초콜릿 제품의 원료가 되는 초콜릿 원액(비터 초콜릿, Bitter chocolate) 4kg에 들어있는 카카오 버터의 함량은 얼마인가?", choices: ["4.5kg", "1.5kg", "2.5kg", "3.5kg"], answer: 1, explanation: "초콜릿 제품의 원료가 되는 비터 초콜릿은 코코아 5/8 비율과 카카오 버터 3/8 비율로 이루어져 있다. 카카오 버터 = 4kg × 3/8 = 1.5kg이다." },
  { id: "2024-round4-044", set: "2024 4회", subject: "2024 4회", question: "화이트 레이어 케이크의 제조 시 흰자 거품을 강하게 하기 위하여 사용되는 재료는?", choices: ["탄산수소나트륨", "유화쇼트닝", "중조", "주석산 크림"], answer: 3, explanation: "화이트 레이어 케이크처럼 흰자를 사용하는 제품에 주석산 크림을 넣는 이유는 흰자의 알칼리성을 중화하고, 흰자의 거품을 강하게 만들며, 머랭의 색상을 희게 하기 때문이다." },
  { id: "2024-round4-045", set: "2024 4회", subject: "2024 4회", question: "코코아 매스에서 코코아 버터를 제거한 다음 식물성 유지와 설탕을 첨가해 템퍼링 작업 없이도 사용할 수 있는 장점을 가진 초콜릿은?", choices: ["커버추어", "밀크 초콜릿", "가나슈용 초콜릿", "파타글라세"], answer: 3, explanation: "파타글라세는 복합초콜릿이라고도 한다. 파타글라세는 초콜릿 매스에서 코코아 버터를 제거한 다음 식물성 유지와 설탕을 첨가해 템퍼링 없이 녹여서 바로 사용할 수 있는 초콜릿이다." },
  { id: "2024-round4-049", set: "2024 4회", subject: "2024 4회", question: "파이의 제조 공정에 대한 설명으로 틀린 것은?", choices: ["파이는 주로 200~220℃의 고온으로 굽는다.", "버터 대신 롤인마가린을 사용할 수 있다.", "파이 반죽은 최종단계까지 믹싱을 충분히 한다.", "0℃의 냉장고에서 보관한 버터를 사용한다."], answer: 2, explanation: "파이 반죽의 믹싱은 글루텐이 생성되기 전인 픽업단계(Pick up Stage)까지 믹싱한다." },
  { id: "2024-round4-050", set: "2024 4회", subject: "2024 4회", question: "밀가루 개량제로 사용하는 물질은?", choices: ["산소", "과산화벤조일", "탄산나트륨", "글루코사미나아제"], answer: 1, explanation: "밀가루 개량제에서 사용하는 과산화벤조일(benzoyl peroxide)은 주로 밀가루의 표백 및 산화 작용을 위해 사용된다. 이 화합물은 밀가루의 색을 더 밝고 고르게 만들어 주는 역할을 하며, 밀가루의 품질을 향상시킨다." },
  { id: "2024-round4-051", set: "2024 4회", subject: "2024 4회", question: "다음 중 휘핑(whipping) 제조 시 일반적으로 오버런이 가장 좋은 크림은?", choices: ["생크림", "식물성 크림", "콤파운드 크림", "커피 크림"], answer: 1, explanation: "오버런(Over-run)은 휘핑, 냉동 등으로 인해 공기 혼합물이 공기 혼입에 의하여 믹스의 용적이 증가하여 부피가 증가하는 현상으로 팽창률이라 한다. 오버런은 식물성 크림이 가장 크다." },
  { id: "2024-round4-052", set: "2024 4회", subject: "2024 4회", question: "제과 제조 공정에서 일어나는 현상에 대한 설명 중 틀린 것은?", choices: ["캐러멜화 반응: 단백질이 높은 온도로 가열되어 갈색의 캐러멜을 만드는 현상", "메일라드 반응: 단백질, 아미노산, 환원당이 열에 의해 멜라노이딘이라는 갈색 색소를 형성하는 현상", "전분의 호화: 전분이 수분과 열에 의해 점성이 있는 상태로 변하는 현상", "전분의 노화: 전분에서 수분이 배출되어 과자의 식감을 딱딱하게 만드는 현상"], answer: 0, explanation: "캐러멜화(Caramelization)는 당의 물리적·화학적 변화가 일으키는 산화 반응의 일종으로, 설탕을 높은 온도로 가열했을 때 갈색의 캐러멜이 생성되는 화학반응이다." },
  { id: "2024-round4-054", set: "2024 4회", subject: "2024 4회", question: "반죽형 케이크의 부드러운 성질(유연성)에 가장 크게 영향을 미치는 요인은?", choices: ["쇼트닝 함량", "밀가루 함량", "달걀 함량", "수분 함량"], answer: 0, explanation: "반죽형 케이크에서 부드러운 성질(유연성)에 가장 큰 영향을 미치는 요인은 쇼트닝의 함량이다. 쇼트닝은 케이크의 굳어지는 것을 방지하고 부드러운 식감을 유지하는 데 도움을 준다. 또한 쇼트닝은 케이크의 수분을 유지하는 데 도움을 주어 케이크가 건조해지지 않도록 방지한다. 이는 케이크가 더 오랜 시간 동안 촉촉하고 부드러운 상태를 유지하도록 한다." },
  { id: "2024-round4-055", set: "2024 4회", subject: "2024 4회", question: "설탕에 대한 설명으로 틀린 것은?", choices: ["상대적 감미도는 100이다.", "포도당과 과당이 결합된 이당류이다.", "비환원당이다.", "120℃를 넘으면 캐러멜 반응을 일으킨다."], answer: 3, explanation: "캐러멜화는 설탕이 일반적으로 160℃ 이상의 온도에 도달하면 시작된다. 다만 설탕의 종류에 따라 캐러멜화 온도가 약간씩 다르며, 가열을 통해 다양한 맛과 향을 더해준다." },
  { id: "2024-round4-056", set: "2024 4회", subject: "2024 4회", question: "퍼프 페이스트리 굽기 중 유지가 흘러내리는 원인이 아닌 것은?", choices: ["높은 온도에서 반죽을 휴지할 때", "밀어 펴기와 접기가 부족할 때", "높은 온도의 철판과 오븐을 사용할 때", "달걀물칠이 과도할 때"], answer: 2, explanation: "퍼프 페이스트리 굽는 동안 유지가 흘러나오는 원인으로는 밀어 펴기 부적절, 박력분 사용, 오븐 온도가 너무 높거나 낮을 때, 오래된 반죽을 사용할 때 등이 있다." },
  { id: "2024-round4-057", set: "2024 4회", subject: "2024 4회", question: "도넛의 설탕이 수분을 흡수하여 녹는 현상을 방지하기 위한 방법으로 잘못된 것은?", choices: ["스테아린 경화제를 10% 첨가하여 사용한다.", "냉각 중 환기가 잘 되도록 하여 식힌다.", "도넛 위에 뿌리는 설탕 사용량을 늘린다.", "튀기는 시간을 늘려 수분 함량을 줄인다."], answer: 0, explanation: "발한 현상은 도넛에 입힌 설탕이나 글레이즈가 수분에 녹아 시럽처럼 변하는 현상이다. 흡유 현상은 도넛 기름이 도넛 설탕을 적시는 현상으로 기름의 온도가 낮기 때문이다. 대책은 스테아린을 3~6% 첨가하여 사용하는 것이다." },
  { id: "2024-round4-058", set: "2024 4회", subject: "2024 4회", question: "유지의 특성으로 옳은 것은?", choices: ["가소성은 제품의 부드러운 정도를 나타낸다.", "안정성은 유지가 상온에서 고체 모양을 유지하는 성질이다.", "쇼트닝성은 지방의 산화와 산패를 장기간 억제하는 성질이다.", "크림성은 유지가 믹싱 조작 중 공기를 포집하는 능력이다."], answer: 3, explanation: "가소성은 유지가 상온에서 너무 단단하지 않으면서 고체 모양을 유지하는 성질이다. 안정성은 지방의 산화와 산패를 장기간 억제하는 성질이다. 쇼트닝성은 빵·과자 제품에 부드러움을 주는 성질로 버터나 쇼트닝이 많이 가지고 있다." },
  { id: "2024-round4-060", set: "2024 4회", subject: "2024 4회", question: "유지의 성질 중 트랜스 지방이 생성되는 과정은?", choices: ["유지의 유화", "유지의 경화", "유지의 산화", "유지의 검화"], answer: 1, explanation: "유지의 산화가 쉽고 어려움은 지방산의 불포화도의 대소에 의한 것이며, 일반적으로 아이오딘 값이 클수록 산화되기 쉽다. 자연산에 니켈 등의 촉매를 사용하여 수소를 첨가하면 불포화지방산의 이중결합에 수소가 첨가되어 녹는점이 상승하면서 고체성이 된다. 이 현상을 경화라 하며 이를 경화유, 트랜스 지방이라 한다. 이에는 마가린과 쇼트닝이 있다." },
  { id: "2023-001", set: "2023 1회", subject: "2023 1회", question: "아몬드 타르트 제조 방법이 잘못된 것은?", choices: ["반죽법은 크림법으로 제조한다.", "껍질은 글루텐이 형성되지 않도록 반죽하고 냉장 휴지한다.", "크림을 너무 많이 짜지 않는다.", "바닥 껍질은 5mm 정도로 밀어 틀 안쪽으로 끝까지 밀어줘야 수축을 방지할 수 있다."], answer: 3, explanation: "바닥 껍질은 2~3mm 정도가 적당하다." },
  { id: "2023-002", set: "2023 1회", subject: "2023 1회", question: "박력분에 대한 설명이 잘못된 것은?", choices: ["연질소맥으로 단백질 함량은 7~9%이다.", "주로 케이크에 사용하며 회분 함량은 0.4~0.5이다.", "글루텐의 질은 매우 부드럽다.", "밀가루의 입도는 분상질이다."], answer: 1, explanation: "제과용 박력분의 회분 함량은 0.4% 이하이다." },
  { id: "2023-003", set: "2023 1회", subject: "2023 1회", question: "반죽형 반죽 중에서 수분이 가장 많은 쿠키는?", choices: ["쇼트브레드 쿠키", "드롭 쿠키", "스냅 쿠키", "스펀지 쿠키"], answer: 3, explanation: "스펀지 쿠키는 거품형 반죽이며 다른 쿠키는 계란 사용량이 많아 짤주머니에 모양 깍지를 끼우고 짜는 쿠키이다." },
  { id: "2023-004", set: "2023 1회", subject: "2023 1회", question: "페이스트리 반죽을 굽는 과정에서 수축의 원인이 아닌 것은?", choices: ["휴지를 충분히 하지 않은 경우", "과도한 밀어 펴기를 한 경우", "반죽이 질은 경우", "덧가루를 많이 사용한 경우"], answer: 3, explanation: "모양을 낸 후 수축하는 원인은 휴지가 충분하지 않음, 과도한 밀어 펴기, 된 반죽이다." },
  { id: "2023-008", set: "2023 1회", subject: "2023 1회", question: "다음 중 이형제에 대한 설명으로 옳지 않은 것은?", choices: ["발연점이 높은 기름을 사용한다.", "이형제의 사용량은 반죽 무게에 대하여 0.1~0.2% 정도가 적당하다.", "반죽을 구울 때 철판에서 제품의 분리를 용이하게 할 수 있다.", "이형제의 사용량이 많으면 밑 껍질이 얇아지고 색상이 밝아진다."], answer: 3, explanation: "이형제의 사용량이 많으면 밑 껍질이 두꺼워지고 색상은 어두워진다." },
  { id: "2023-010", set: "2023 1회", subject: "2023 1회", question: "반죽형 쿠키의 굽기 과정에서 퍼짐성이 나쁠 때 퍼짐성을 좋게 하기 위해 사용할 수 있는 방법은?", choices: ["입자가 굵은 설탕을 많이 사용한다.", "반죽을 오래한다.", "오븐 온도를 높인다.", "설탕의 양을 줄인다."], answer: 0, explanation: "쿠키의 퍼짐성을 좋게 하기 위한 방법에는 굵은 입자의 설탕 사용, 중조와 암모늄 사용, 알칼리성 재료 사용, 낮은 오븐 온도 등이 있다." },
  { id: "2023-014", set: "2023 1회", subject: "2023 1회", question: "다음 머랭 중 설탕이 가장 적게 들어가는 머랭은?", choices: ["프렌치 머랭", "스위스 머랭", "이탈리안 머랭", "코코넛 머랭"], answer: 0, explanation: "프렌치 머랭(흰자:설탕=1:1), 스위스 머랭(흰자:설탕=1:1.8), 이탈리안 머랭(흰자:설탕=1:2)이다." },
  { id: "2023-016", set: "2023 1회", subject: "2023 1회", question: "다크 초콜릿의 템퍼링 과정이 잘못된 것은?", choices: ["1차 용해 온도는 35~40℃이다.", "식히는 온도는 27℃ 정도이다.", "최종온도는 30~31℃이다.", "화이트 초콜릿의 최종 온도는 다크 초콜릿보다 낮다."], answer: 0, explanation: "다크 초콜릿의 1차 용해 온도는 45~50℃이다." },
  { id: "2023-017", set: "2023 1회", subject: "2023 1회", question: "무스에 사용하는 안정제는?", choices: ["한천", "CMC", "펙틴", "젤라틴"], answer: 3, explanation: "무스에는 동물성 안정제인 젤라틴을 주로 사용한다." },
  { id: "2023-019", set: "2023 1회", subject: "2023 1회", question: "벌립법에 대한 설명으로 옳지 않은 것은?", choices: ["계란을 노른자와 흰자로 분리한 후 거품을 낸다.", "노른자와 식용유를 넣고 섞은 후, 설탕을 넣고 녹인다.", "흰자와 흰자용 설탕을 이용하여 머랭을 올려 사용한다.", "비중은 0.5 내외이다."], answer: 2, explanation: "사용법은 노른자와 식용유를 넣고 섞은 후 설탕과 물을 넣고 녹인다." },
  { id: "2023-025", set: "2023 1회", subject: "2023 1회", question: "Over-Run이 가장 큰 크림은?", choices: ["식물성 크림", "동물성 크림", "컴파운드 버터", "식용유"], answer: 1, explanation: "Over-run은 생크림 속에 공기가 들어가 부피가 증가한 퍼센트를 말하며 우유 지방에서 추출되는 동물성 크림이 식물성 크림보다 가장 크다." },
  { id: "2023-027", set: "2023 1회", subject: "2023 1회", question: "파운드 케이크 제조 시 윗면이 터지는 경우가 아닌 것은?", choices: ["설탕 입자가 남아 있을 때", "반죽 내의 수분이 충분하지 않을 때", "굽기 중 껍질이 천천히 형성될 때", "팬에 넣은 반죽을 장시간 방치할 때"], answer: 3, explanation: "파운드 케이크 제조 시 높은 온도에서 구워 껍질이 빨리 형성된 경우 윗면이 터진다. 굽기 중 껍질 형성이 느리면 반죽 온도가 낮다는 것이며, 이런 경우는 껍질이 천천히 형성되면서 수분이 많이 손실되어 터지지 않는 원인이 된다." },
  { id: "2023-028", set: "2023 1회", subject: "2023 1회", question: "설탕에 대한 설명으로 잘못된 것은?", choices: ["설탕이 산화되고 산의 인버테이스제에 의해 포도당과 과당으로 분해된다.", "수분보유력이 있어 노화가 지연된다.", "설탕이 130℃에서 캐러멜 반응이 시작된다.", "글루텐의 연화제로서의 역할을 한다."], answer: 2, explanation: "설탕의 캐러멜화 온도는 160℃ 이상이다." },
  { id: "2023-032", set: "2023 1회", subject: "2023 1회", question: "롤 케이크를 말 때 표면의 터짐을 방지하는 방법이 아닌 것은?", choices: ["설탕 일부를 물엿이나 시럽으로 대체한다.", "노른자 양을 늘리고 흰자의 양을 증가시킨다.", "낮은 온도에서 천천히 오래 굽는다.", "밀봉이 너무 빠지 않게 굽는다."], answer: 1, explanation: "낮은 온도에서 오래 굽지 않는다(오버베이킹 금지)." },
  { id: "2023-033", set: "2023 1회", subject: "2023 1회", question: "굽기 과정 중 오버베이킹과 언더베이킹에 대한 설명 중 잘못된 것은?", choices: ["언더베이킹은 중앙 부분이 익지 않는 경우가 많다.", "오버베이킹은 윗면이 갈라지기 쉽다.", "언더베이킹은 수분 함량이 많다.", "오버베이킹은 노화가 빠르다."], answer: 2, explanation: "오버베이킹의 특징은 윗면이 평평하고 수분 손실이 커 노화가 빠르며 부피가 크다. 언더베이킹의 특징은 윗면이 갈라지며 중앙으로 들어가 있고 조직이 거칠며 주저앉기 쉽고 부피가 작다." },
  { id: "2023-036", set: "2023 1회", subject: "2023 1회", question: "슈 공정 중에서 잘못된 것은?", choices: ["물 + 소금 + 유지를 넣고 센불로 끓인다.", "팽창제(베이킹파우더 등)를 넣을 경우 계란 넣기 전에 넣는다.", "처음엔 아랫불을 높여 굽다가 충분히 팽창하고 표피가 터지면 아랫불을 줄이고 윗불을 높여 굽는다.", "슈가 주저앉을 수 있으므로 팽창 중에 문을 자주 열지 않는다."], answer: 1, explanation: "팽창제(베이킹파우더 등)를 넣을 경우 마지막에 넣는다." },
  { id: "2023-038", set: "2023 1회", subject: "2023 1회", question: "반죽 온도에 대한 설명으로 잘못된 것은?", choices: ["퍼프 페이스트리의 반죽 온도는 20℃가 적당하다.", "버터 스펀지 케이크의 반죽 온도는 20℃가 적당하다.", "사과 파이 반죽의 물 온도는 38℃가 적당하다.", "퍼프 페이스트리의 반죽 온도는 20℃이다."], answer: 3, explanation: "사과 파이의 반죽은 차가운 물을 이용하여 20℃ 이하로 만든다." },
  { id: "2023-041", set: "2023 1회", subject: "2023 1회", question: "완성된 초콜릿을 보관하기에 적당하지 않은 곳은?", choices: ["온도와 습도가 낮은 곳", "직사광선이 없는 서늘한 곳", "알루미늄 호일에 싸서 밀폐용기에 넣어 보관", "냉장 상태의 냉장고"], answer: 3, explanation: "초콜릿 보관 온도는 15~18℃, 습도 40~50% 정도가 적당하며 빛과 습도는 가급적 피해서 보관한다. 냉장 보관할 경우 초콜릿의 차가운 냉기가 냉장고의 습기로 인해 품질이 나빠지고 초콜릿이 냄새를 흡수할 수 있으므로 최대한 실온 보관하는 것이 좋다." },
  { id: "2023-043", set: "2023 1회", subject: "2023 1회", question: "다음 중 거품형 쿠키는?", choices: ["쇼트브레드 쿠키", "초코칩 쿠키", "프레첼", "핑거 쿠키"], answer: 3, explanation: "핑거 쿠키는 거품형 쿠키로 공립법으로 제조하며 5cm 정도로 짜서 굽는다." },
  { id: "2023-044", set: "2023 1회", subject: "2023 1회", question: "초콜릿을 만들 때 들어가는 카카오 버터의 결정형이 가장 안정적인 구조를 갖는 것은?", choices: ["γ", "α", "β′", "β"], answer: 3, explanation: "카카오 버터의 결정형은 γ(16~18℃), α(21~24℃), β′(27~29℃), β(34~36℃)이며 β가 가장 안정적인 결정형이다." },
  { id: "2023-046", set: "2023 1회", subject: "2023 1회", question: "파이용 마가린(롤인용 마가린)의 특징 중 가장 중요한 것은?", choices: ["크림성", "쇼트닝성", "가용성", "가소성"], answer: 3, explanation: "가소성이란 고체에 힘을 가했을 때 모양의 변화와 유지가 가능한 성질이다. 유지가 너무 단단하면 반죽이 파괴되고 무르면 고르게 퍼지지 않으므로 사용 온도 범위가 넓은 것이 좋다. 페이스트리 등의 결을 살리는 제품 제조에서 밀어 펴거나 성형하는 작업을 가능하게 한다." },
  { id: "2023-047", set: "2023 1회", subject: "2023 1회", question: "이탈리안 머랭에 대한 설명으로 옳지 않은 것은?", choices: ["냉과, 무스 등에 사용한다.", "흰자를 거품 내다 뜨겁게 졸인 설탕 시럽을 넣고 만든다.", "슈를 연하게 굽는 제품에 사용한다.", "설탕 시럽을 끓이는 온도는 114~118℃이다."], answer: 2, explanation: "이탈리안 머랭은 굽지 않는 제품에 사용한다." },
  { id: "2023-048", set: "2023 1회", subject: "2023 1회", question: "퐁당 크림을 부드럽게 하고 수분 보유력을 높이기 위해 일반적으로 첨가하는 것은?", choices: ["한천, 젤라틴", "물, 전분", "쇼트닝, 크림", "물엿, 전화당 시럽"], answer: 2, explanation: "퐁당 크림을 녹여서 케이크에 바를 때에는 크림 상태의 버터를 사용한다." },
  { id: "2023-052", set: "2023 1회", subject: "2023 1회", question: "파이 제조 시 충전물이 끓어 넘치는 이유가 아닌 것은?", choices: ["껍질에 수분이 많았다.", "천연산이 많이 든 과일을 썼다.", "충전물의 온도가 낮다.", "설탕량이 많다."], answer: 2, explanation: "충전물의 온도가 높을 때 충전물이 끓어 넘친다." },
  { id: "2023-053", set: "2023 1회", subject: "2023 1회", question: "베이킹파우더가 들어가지 않은 파운드 케이크의 특징으로 옳은 것은?", choices: ["부피가 크고 부드럽다.", "부피가 작고 부드럽다.", "부피가 크고 무겁다.", "부피가 작고 무겁다."], answer: 3, explanation: "베이킹파우더는 화학적 팽창제로 부피를 크게 하고 제품을 부드럽게 한다." },
  { id: "2023-055", set: "2023 1회", subject: "2023 1회", question: "페트병 제조가 가능한 포장 재료는?", choices: ["oriented polypropylene(OPP)", "polyethylene(PE)", "polypropylene(PP)", "polystyrene(PS)"], answer: 1, explanation: "폴리에틸렌(polyethylene)은 열에 강한 소재로 포장용품에 많이 사용된다. 기름에 가루약을 넣거나 제품군에 사용되며 페트병의 주원료가 되기도 한다." },
  { id: "2023-059", set: "2023 1회", subject: "2023 1회", question: "제과에서 달걀의 역할로 옳은 것은?", choices: ["영양 가치 증가, 유화 역할, pH 강화", "영양 가치 증가, 유화 역할, 조직 강화", "영양 가치 증가, 조직 강화, 방부 효과", "유화 역할, 조직 강화, 발효 시간 단축"], answer: 1, explanation: "달걀은 완전 단백질에 속하며, 내조직을 형성하고 노른자의 레시틴은 유화제 역할을 한다." }

];
</script>
<script>
(function(){
  "use strict";

  var STORAGE_KEY = "breadquiz_v1";

  // ---------- 저장 데이터 ----------
  function loadStore(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultStore();
      var parsed = JSON.parse(raw);
      return Object.assign(defaultStore(), parsed);
    }catch(e){
      return defaultStore();
    }
  }
  function defaultStore(){
    return {
      stats: {},        // { subject: {correct, total} }
      wrongIds: [],     // 틀린 문제 id 배열
      session: null,    // 진행 중 세션 (이어풀기용)
      setProgress: {}   // { setId: { solved: [id,...], correct: {id: bool} } }
    };
  }
  function saveStore(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  }
  var store = loadStore();

  // ---------- 유틸 ----------
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }
  function byId(id){ return document.getElementById(id); }
  function show(el){ el.classList.remove("hidden"); }
  function hide(el){ el.classList.add("hidden"); }

  var screens = {
    home: byId("screen-home"),
    quiz: byId("screen-quiz"),
    result: byId("screen-result")
  };
  function goto(name){
    Object.keys(screens).forEach(function(k){
      if(k===name) show(screens[k]); else hide(screens[k]);
    });
    window.scrollTo(0,0);
  }

  // ---------- 문제지 set 목록 추출 ----------
  // QUESTIONS 배열의 각 문제에 set 필드(예: "2024 1회")가 있다고 가정
  // set 필드가 없으면 "기타"로 묶음
  function getSets(){
    if(typeof QUESTIONS === "undefined" || QUESTIONS.length === 0) return [];
    var order = [];
    var map = {};
    QUESTIONS.forEach(function(q){
      var setName = q.set || "기타";
      if(!map[setName]){
        map[setName] = [];
        order.push(setName);
      }
      map[setName].push(q);
    });
    return order.map(function(name){ return { name: name, questions: map[name] }; });
  }

  // ---------- set 진도 계산 ----------
  function getSetProgress(setName, questions){
    var prog = store.setProgress[setName];
    var total = questions.length;
    if(!prog || !prog.solved || prog.solved.length === 0){
      return { solved: 0, total: total, pct: 0 };
    }
    var solved = prog.solved.length;
    return {
      solved: Math.min(solved, total),
      total: total,
      pct: Math.round((Math.min(solved, total) / total) * 100)
    };
  }

  // ---------- 홈 화면 렌더 ----------
  var currentSetName = null;  // 모달에서 선택 중인 set

  function renderHome(){
    var setList = byId("set-list");
    setList.innerHTML = "";
    var sets = getSets();

    if(sets.length === 0){
      var p = document.createElement("p");
      p.className = "no-data";
      p.style.marginTop = "8px";
      p.textContent = "아직 등록된 문제가 없어요. questions.js에 문제를 추가해주세요.";
      setList.appendChild(p);
    } else {
      sets.forEach(function(s){
        var prog = getSetProgress(s.name, s.questions);
        var card = document.createElement("button");
        card.className = "set-card";
        card.innerHTML =
          '<div class="set-card-info">'+
            '<div class="set-card-name">'+s.name+'</div>'+
            '<div class="set-card-bar-wrap">'+
              '<div class="set-bake-bar"><div class="set-bake-bar-fill" style="width:'+prog.pct+'%"></div></div>'+
              '<div class="set-card-pct">'+prog.pct+'%</div>'+
            '</div>'+
            '<div class="set-card-count">'+prog.solved+' / '+prog.total+'문제 완료</div>'+
          '</div>'+
          '<span class="menu-arrow">›</span>';
        card.addEventListener("click", function(){ openSetModal(s.name, s.questions); });
        setList.appendChild(card);
      });
    }

    var wrongBtn = byId("btn-wrong");
    var wrongDesc = byId("wrong-desc");
    var wrongCount = store.wrongIds.length;
    wrongDesc.textContent = wrongCount+"문제 저장됨";
    wrongBtn.disabled = wrongCount===0;
  }

  // ---------- set 선택 모달 ----------
  function openSetModal(setName, questions){
    currentSetName = setName;
    byId("modal-set-name").textContent = setName;
    var prog = getSetProgress(setName, questions);
    byId("modal-set-progress").textContent = prog.solved+" / "+prog.total+"문제 완료 · "+prog.pct+"%";

    // 이어풀기: 해당 set의 진행 중인 session이 있을 때만 활성화
    var continueBtn = byId("modal-btn-continue");
    var hasSession = store.session &&
                     store.session.setName === setName &&
                     store.session.queue &&
                     store.session.index < store.session.queue.length;
    continueBtn.disabled = !hasSession;

    show(byId("set-modal-overlay"));
  }

  function closeSetModal(){
    hide(byId("set-modal-overlay"));
    currentSetName = null;
  }

  // ---------- 순서 선택 모달 ----------
  function openOrderModal(){
    // closeSetModal 대신 직접 숨김 — currentSetName 유지
    hide(byId("set-modal-overlay"));
    show(byId("order-modal-overlay"));
  }

  function closeOrderModal(){
    hide(byId("order-modal-overlay"));
    currentSetName = null;
  }

  // ---------- 세션 시작 ----------
  function startSetSession(setName, randomOrder){
    var sets = getSets();
    var found = null;
    sets.forEach(function(s){ if(s.name === setName) found = s; });
    if(!found || found.questions.length === 0){
      alert("문제를 찾을 수 없어요.");
      return;
    }
    var pool = randomOrder ? shuffle(found.questions) : found.questions.slice();
    var queue = pool.map(function(q){ return q.id; });
    store.session = { queue: queue, index: 0, correctCount: 0, log: [], mode: "set", setName: setName };
    saveStore();
    runQuestion();
  }

  function continueSetSession(){
    if(!store.session) return;
    runQuestion();
  }

  function startWrongSession(){
    var idSet = {};
    var queue = store.wrongIds.filter(function(id){
      if(idSet[id]) return false;
      idSet[id]=true;
      return QUESTIONS.some(function(q){return q.id===id;});
    });
    if(queue.length===0){
      alert("틀린 문제가 없어요.");
      return;
    }
    store.session = { queue: shuffle(queue), index: 0, correctCount: 0, log: [], mode: "wrong", setName: null };
    saveStore();
    runQuestion();
  }

  // ---------- 퀴즈 진행 ----------
  var currentAnswered = false;

  function findQuestion(id){
    for(var i=0;i<QUESTIONS.length;i++){
      if(QUESTIONS[i].id===id) return QUESTIONS[i];
    }
    return null;
  }

  function runQuestion(){
    var sess = store.session;
    if(!sess || sess.index >= sess.queue.length){
      finishSession();
      return;
    }
    var q = findQuestion(sess.queue[sess.index]);
    if(!q){
      sess.index++;
      saveStore();
      runQuestion();
      return;
    }
    currentAnswered = false;
    goto("quiz");

    byId("progress-count").textContent = (sess.index+1)+"/"+sess.queue.length;
    byId("progress-fill").style.width = Math.round((sess.index/sess.queue.length)*100)+"%";
    byId("subject-tag").textContent = q.subject;
    byId("question-text").textContent = q.question;

    var passageBox = byId("passage-box");
    if(q.passage){
      passageBox.textContent = q.passage;
      show(passageBox);
    }else{
      hide(passageBox);
    }

    var choicesEl = byId("choices");
    choicesEl.innerHTML = "";
    q.choices.forEach(function(choiceText, idx){
      var btn = document.createElement("button");
      btn.className = "choice";
      btn.innerHTML = '<span class="choice-num">'+(idx+1)+'</span><span>'+choiceText+'</span>';
      btn.addEventListener("click", function(){ selectAnswer(q, idx, choicesEl); });
      choicesEl.appendChild(btn);
    });

    hide(byId("feedback-box"));
    byId("feedback-box").classList.remove("show","correct","wrong");
    byId("btn-next").classList.remove("show");
  }

  function selectAnswer(q, idx, choicesEl){
    if(currentAnswered) return;
    currentAnswered = true;

    var isCorrect = idx === q.answer;
    var buttons = choicesEl.querySelectorAll(".choice");
    buttons.forEach(function(btn, i){
      btn.classList.add("disabled");
      if(i === q.answer) btn.classList.add("correct");
      else if(i === idx) btn.classList.add("wrong");
      else btn.classList.add("dim");
    });

    // 과목별 통계 업데이트
    if(!store.stats[q.subject]) store.stats[q.subject] = {correct:0, total:0};
    store.stats[q.subject].total++;
    if(isCorrect) store.stats[q.subject].correct++;

    // set 진도 업데이트
    var sess = store.session;
    if(sess.setName){
      if(!store.setProgress[sess.setName]) store.setProgress[sess.setName] = { solved: [], correct: {} };
      var sp = store.setProgress[sess.setName];
      if(sp.solved.indexOf(q.id) === -1) sp.solved.push(q.id);
      sp.correct[q.id] = isCorrect;
    }

    // 오답노트 업데이트
    var wrongIdx = store.wrongIds.indexOf(q.id);
    if(isCorrect){
      if(wrongIdx>-1) store.wrongIds.splice(wrongIdx,1);
    }else{
      if(wrongIdx===-1) store.wrongIds.push(q.id);
    }

    // 세션 로그
    sess.log.push({ id:q.id, question:q.question, correct:isCorrect });
    if(isCorrect) sess.correctCount++;

    saveStore();

    var fb = byId("feedback-box");
    var label = byId("feedback-label");
    var text = byId("feedback-text");
    fb.classList.remove("hidden","correct","wrong");
    fb.classList.add(isCorrect ? "correct" : "wrong", "show");
    label.textContent = isCorrect ? "정답이에요" : "아쉬워요, 오답이에요";
    text.textContent = q.explanation || "";

    byId("btn-next").classList.remove("hidden");
    byId("btn-next").classList.add("show");
  }

  function nextQuestion(){
    var sess = store.session;
    sess.index++;
    saveStore();
    runQuestion();
  }

  function finishSession(){
    var sess = store.session;
    var total = sess.queue.length;
    var correct = sess.correctCount;

    byId("result-total-label").innerHTML = correct+"<span> / "+total+"</span>";
    var pct = total>0 ? Math.round((correct/total)*100) : 0;
    var caption = pct>=80 ? "잘 구워졌어요!" : (pct>=50 ? "조금만 더 반죽해봐요" : "이 판은 다시 한번 풀어봐요");
    byId("result-caption").textContent = caption+" · 정답률 "+pct+"%";

    var list = byId("result-list");
    list.innerHTML = "";
    sess.log.forEach(function(item){
      var row = document.createElement("div");
      row.className = "result-item";
      row.innerHTML =
        '<span class="result-mark '+(item.correct?"o":"x")+'">'+(item.correct?"O":"X")+'</span>'+
        '<span class="result-item-text">'+item.question+'</span>';
      list.appendChild(row);
    });

    store.session = null;
    saveStore();
    goto("result");
  }

  // ---------- 이벤트 바인딩 ----------
  // set 선택 모달
  byId("modal-btn-new").addEventListener("click", function(){
    openOrderModal();
  });
  byId("modal-btn-continue").addEventListener("click", function(){
    closeSetModal();
    continueSetSession();
  });
  byId("modal-close").addEventListener("click", closeSetModal);
  byId("set-modal-overlay").addEventListener("click", function(e){
    if(e.target === this) closeSetModal();
  });

  // 순서 선택 모달
  byId("order-btn-random").addEventListener("click", function(){
    var sn = currentSetName;
    closeOrderModal();
    startSetSession(sn, true);
  });
  byId("order-btn-original").addEventListener("click", function(){
    var sn = currentSetName;
    closeOrderModal();
    startSetSession(sn, false);
  });
  byId("order-close").addEventListener("click", function(){
    var sn = currentSetName;
    closeOrderModal();
    if(sn){
      var sets = getSets();
      sets.forEach(function(s){ if(s.name === sn) openSetModal(s.name, s.questions); });
    }
  });
  byId("order-modal-overlay").addEventListener("click", function(e){
    if(e.target === this){
      var sn = currentSetName;
      closeOrderModal();
      if(sn){
        var sets = getSets();
        sets.forEach(function(s){ if(s.name === sn) openSetModal(s.name, s.questions); });
      }
    }
  });

  byId("btn-wrong").addEventListener("click", startWrongSession);
  byId("btn-next").addEventListener("click", nextQuestion);
  byId("btn-result-home").addEventListener("click", function(){
    renderHome();
    goto("home");
  });
  byId("btn-quit").addEventListener("click", function(){
    renderHome();
    goto("home");
  });

  // ---------- 시작 ----------
  renderHome();
  goto("home");
})();
</script>
</body>
</html>
