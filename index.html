<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5B3A29">
<title>굽기 연습 — 제빵산업기사 필기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --flour:#FAF0E1;
    --flour-card:#FFFBF4;
    --crust:#5B3A29;
    --charcoal:#2B211A;
    --caramel:#C17817;
    --caramel-dark:#9C5E10;
    --wheat:#E8C468;
    --jam:#A83232;
    --jam-bg:#F5DEDA;
    --sage:#6B8E5A;
    --sage-bg:#DFE9D6;
    --line:#E4D3B8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--flour);
    color:var(--charcoal);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .hidden{display:none !important;}

  /* ---------- 공통 ---------- */
  h1,h2,h3{
    font-family:'Gowun Batang', serif;
    font-weight:700;
    margin:0;
    color:var(--crust);
  }
  button{font-family:inherit;}
  button:focus-visible, .choice:focus-visible{
    outline:3px solid var(--caramel);
    outline-offset:2px;
  }

  /* ---------- 홈 화면 ---------- */
  .home-header{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:4px;
  }
  .home-header h1{font-size:26px;}
  .home-sub{
    font-size:14px;
    color:#8A7360;
    margin:0 0 28px 0;
  }
  .gauge-card{
    background:var(--flour-card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px;
    margin-bottom:16px;
  }
  .gauge-title{
    font-size:13px;
    font-weight:600;
    color:var(--caramel-dark);
    letter-spacing:.02em;
    margin-bottom:14px;
  }
  .subject-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
  }
  .subject-row:last-child{margin-bottom:0;}
  .subject-name{
    width:96px;
    flex-shrink:0;
    font-size:13px;
    font-weight:600;
    color:var(--crust);
  }
  .bake-bar{
    flex:1;
    height:10px;
    border-radius:6px;
    background:#F0E4CC;
    overflow:hidden;
    position:relative;
  }
  .bake-bar-fill{
    height:100%;
    border-radius:6px;
    background:linear-gradient(90deg, var(--wheat), var(--caramel));
    transition:width .5s ease;
  }
  .subject-pct{
    width:40px;
    text-align:right;
    font-size:13px;
    font-weight:600;
    color:var(--caramel-dark);
    flex-shrink:0;
  }
  .no-data{
    font-size:13px;
    color:#A8927A;
  }

  .menu-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:8px;
  }
  .menu-btn{
    background:var(--flour-card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
    text-align:left;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .menu-btn:active{transform:scale(.98);}
  .menu-btn.primary{
    background:var(--crust);
    border-color:var(--crust);
  }
  .menu-btn.primary .menu-btn-title{color:var(--flour);}
  .menu-btn.primary .menu-btn-desc{color:#D8C4AC;}
  .menu-btn:disabled{opacity:.45;cursor:default;}
  .menu-btn-title{
    font-size:16px;
    font-weight:700;
    color:var(--crust);
    margin-bottom:2px;
  }
  .menu-btn-desc{
    font-size:12.5px;
    color:#8A7360;
  }
  .menu-arrow{
    font-size:18px;
    color:var(--caramel);
    flex-shrink:0;
    margin-left:12px;
  }
  .menu-btn.primary .menu-arrow{color:var(--wheat);}

  .footer-note{
    margin-top:auto;
    padding-top:24px;
    font-size:11.5px;
    color:#B3A188;
    text-align:center;
    line-height:1.6;
  }

  /* ---------- 퀴즈 화면 ---------- */
  .quiz-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .quit-btn{
    background:none;
    border:none;
    font-size:20px;
    color:var(--crust);
    cursor:pointer;
    padding:4px 6px;
    line-height:1;
  }
  .progress-track{
    flex:1;
    height:8px;
    border-radius:5px;
    background:#F0E4CC;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--wheat), var(--caramel));
    border-radius:5px;
    transition:width .3s ease;
  }
  .progress-count{
    font-size:12.5px;
    font-weight:600;
    color:var(--caramel-dark);
    flex-shrink:0;
    min-width:40px;
    text-align:right;
  }
  .subject-tag{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    color:var(--caramel-dark);
    background:#F3E3C4;
    border-radius:999px;
    padding:4px 12px;
    margin-bottom:14px;
  }
  .question-text{
    font-family:'Gowun Batang', serif;
    font-size:19px;
    line-height:1.55;
    color:var(--charcoal);
    margin-bottom:16px;
  }
  .passage-box{
    background:#F3E9D6;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    font-size:14.5px;
    line-height:1.8;
    color:var(--crust);
    margin-bottom:18px;
    white-space:pre-wrap;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:18px;
  }
  .choice{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--flour-card);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    font-size:15px;
    text-align:left;
    color:var(--charcoal);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .choice-num{
    width:24px;
    height:24px;
    border-radius:50%;
    background:#F0E4CC;
    color:var(--crust);
    font-size:12.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .choice:active{background:#F5EBD8;}
  .choice.correct{
    background:var(--sage-bg);
    border-color:var(--sage);
  }
  .choice.correct .choice-num{background:var(--sage);color:#fff;}
  .choice.wrong{
    background:var(--jam-bg);
    border-color:var(--jam);
  }
  .choice.wrong .choice-num{background:var(--jam);color:#fff;}
  .choice.disabled{cursor:default;}
  .choice.dim{opacity:.5;}

  .feedback-box{
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:18px;
    display:none;
  }
  .feedback-box.show{display:block;animation:fadeIn .2s ease;}
  .feedback-box.correct{background:var(--sage-bg);}
  .feedback-box.wrong{background:var(--jam-bg);}
  .feedback-label{
    font-size:13.5px;
    font-weight:700;
    margin-bottom:6px;
  }
  .feedback-box.correct .feedback-label{color:#3F5A34;}
  .feedback-box.wrong .feedback-label{color:#7A2424;}
  .feedback-text{
    font-size:14px;
    line-height:1.6;
    color:var(--charcoal);
  }

  .next-btn{
    margin-top:auto;
    background:var(--crust);
    color:var(--flour);
    border:none;
    border-radius:14px;
    padding:16px;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
    display:none;
  }
  .next-btn.show{display:block;animation:fadeIn .2s ease;}
  .next-btn:active{background:var(--charcoal);}

  /* ---------- 결과 화면 ---------- */
  .result-hero{
    text-align:center;
    padding:12px 0 28px;
  }
  .result-score{
    font-family:'Gowun Batang', serif;
    font-size:52px;
    font-weight:700;
    color:var(--caramel);
    line-height:1;
  }
  .result-score span{font-size:22px;color:#B3A188;font-weight:400;}
  .result-caption{
    margin-top:10px;
    font-size:14px;
    color:#8A7360;
  }
  .result-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:20px;
  }
  .result-item{
    background:var(--flour-card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:13.5px;
  }
  .result-mark{
    flex-shrink:0;
    width:20px;
    height:20px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:700;
    color:#fff;
    margin-top:1px;
  }
  .result-mark.o{background:var(--sage);}
  .result-mark.x{background:var(--jam);}
  .result-item-text{color:var(--charcoal);line-height:1.5;}

  .result-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:auto;
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===== 홈 화면 ===== -->
  <div id="screen-home" class="screen">
    <div class="home-header">
      <h1>🍞 굽기 연습</h1>
    </div>
    <p class="home-sub">제빵산업기사 필기, 출퇴근길에 한 판씩</p>

    <div class="gauge-card">
      <div class="gauge-title">과목별 굽기 진행도</div>
      <div id="gauge-body"></div>
    </div>

    <div class="menu-list">
      <button class="menu-btn primary" id="btn-continue">
        <div>
          <div class="menu-btn-title">이어서 풀기</div>
          <div class="menu-btn-desc" id="continue-desc">저장된 세션 없음</div>
        </div>
        <span class="menu-arrow">›</span>
      </button>
      <button class="menu-btn" id="btn-new">
        <div>
          <div class="menu-btn-title">새 문제 10개 풀기</div>
          <div class="menu-btn-desc">전 과목에서 무작위로 출제</div>
        </div>
        <span class="menu-arrow">›</span>
      </button>
      <button class="menu-btn" id="btn-wrong">
        <div>
          <div class="menu-btn-title">틀린 문제만 다시 풀기</div>
          <div class="menu-btn-desc" id="wrong-desc">0문제 저장됨</div>
        </div>
        <span class="menu-arrow">›</span>
      </button>
    </div>

    <p class="footer-note">진행 상황은 이 기기의 브라우저에만 저장돼요.<br>홈 화면에 추가해두면 앱처럼 쓸 수 있어요.</p>
  </div>

  <!-- ===== 퀴즈 화면 ===== -->
  <div id="screen-quiz" class="screen hidden">
    <div class="quiz-top">
      <button class="quit-btn" id="btn-quit" aria-label="홈으로">←</button>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-count" id="progress-count">1/10</div>
    </div>

    <span class="subject-tag" id="subject-tag">과목</span>
    <div class="question-text" id="question-text">문제 텍스트</div>
    <div class="passage-box hidden" id="passage-box"></div>

    <div class="choices" id="choices"></div>

    <div class="feedback-box" id="feedback-box">
      <div class="feedback-label" id="feedback-label"></div>
      <div class="feedback-text" id="feedback-text"></div>
    </div>

    <button class="next-btn" id="btn-next">다음 문제</button>
  </div>

  <!-- ===== 결과 화면 ===== -->
  <div id="screen-result" class="screen hidden">
    <div class="result-hero">
      <div class="result-score"><span id="result-total-label"></span></div>
      <div class="result-caption" id="result-caption"></div>
    </div>
    <div class="result-list" id="result-list"></div>
    <div class="result-actions">
      <button class="menu-btn primary" id="btn-result-home">
        <div><div class="menu-btn-title">홈으로</div></div>
        <span class="menu-arrow">›</span>
      </button>
    </div>
  </div>

</div>

<script src="questions.js"></script>
<script>
(function(){
  "use strict";

  var SUBJECTS = ["위생안전관리", "제과점관리", "빵류 제품제조"];
  var STORAGE_KEY = "breadquiz_v1";

  // ---------- 저장 데이터 ----------
  function loadStore(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultStore();
      var parsed = JSON.parse(raw);
      return Object.assign(defaultStore(), parsed);
    }catch(e){
      return defaultStore();
    }
  }
  function defaultStore(){
    return {
      stats: {},        // { subject: {correct, total} }
      wrongIds: [],      // 틀린 문제 id 배열 (최근 상태 기준, 맞히면 제거)
      session: null       // 진행 중 세션 저장 (이어하기용)
    };
  }
  function saveStore(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  }
  var store = loadStore();

  // ---------- 유틸 ----------
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }
  function byId(id){ return document.getElementById(id); }
  function show(el){ el.classList.remove("hidden"); }
  function hide(el){ el.classList.add("hidden"); }

  var screens = {
    home: byId("screen-home"),
    quiz: byId("screen-quiz"),
    result: byId("screen-result")
  };
  function goto(name){
    Object.keys(screens).forEach(function(k){
      if(k===name) show(screens[k]); else hide(screens[k]);
    });
    window.scrollTo(0,0);
  }

  // ---------- 홈 화면 렌더 ----------
  function renderHome(){
    var gaugeBody = byId("gauge-body");
    var hasAny = false;
    gaugeBody.innerHTML = "";
    SUBJECTS.forEach(function(subj){
      var s = store.stats[subj];
      var pct = s && s.total > 0 ? Math.round((s.correct/s.total)*100) : 0;
      if(s && s.total>0) hasAny = true;
      var row = document.createElement("div");
      row.className = "subject-row";
      row.innerHTML =
        '<div class="subject-name">'+subj+'</div>'+
        '<div class="bake-bar"><div class="bake-bar-fill" style="width:'+pct+'%"></div></div>'+
        '<div class="subject-pct">'+pct+'%</div>';
      gaugeBody.appendChild(row);
    });
    if(!hasAny){
      var p = document.createElement("p");
      p.className = "no-data";
      p.textContent = "아직 푼 문제가 없어요. 첫 판을 시작해보세요.";
      gaugeBody.appendChild(p);
    }

    var continueBtn = byId("btn-continue");
    var continueDesc = byId("continue-desc");
    if(store.session && store.session.queue && store.session.index < store.session.queue.length){
      continueBtn.disabled = false;
      continueDesc.textContent = (store.session.index+1)+" / "+store.session.queue.length+"번째 문제부터";
    }else{
      continueBtn.disabled = true;
      continueDesc.textContent = "저장된 세션 없음";
    }

    var wrongBtn = byId("btn-wrong");
    var wrongDesc = byId("wrong-desc");
    var wrongCount = store.wrongIds.length;
    wrongDesc.textContent = wrongCount+"문제 저장됨";
    wrongBtn.disabled = wrongCount===0;
  }

  // ---------- 세션 시작 ----------
  function startNewSession(){
    if(typeof QUESTIONS === "undefined" || QUESTIONS.length===0){
      alert("아직 등록된 문제가 없어요. questions.js에 문제를 추가해주세요.");
      return;
    }
    var pool = shuffle(QUESTIONS);
    var count = Math.min(10, pool.length);
    var queue = pool.slice(0, count).map(function(q){ return q.id; });
    store.session = { queue: queue, index: 0, correctCount: 0, log: [], mode: "new" };
    saveStore();
    runQuestion();
  }

  function startWrongSession(){
    var idSet = {};
    var queue = store.wrongIds.filter(function(id){
      if(idSet[id]) return false;
      idSet[id]=true;
      return QUESTIONS.some(function(q){return q.id===id;});
    });
    if(queue.length===0){
      alert("틀린 문제가 없어요.");
      return;
    }
    store.session = { queue: shuffle(queue), index: 0, correctCount: 0, log: [], mode: "wrong" };
    saveStore();
    runQuestion();
  }

  function continueSession(){
    if(!store.session) return;
    runQuestion();
  }

  // ---------- 퀴즈 진행 ----------
  var currentAnswered = false;

  function findQuestion(id){
    for(var i=0;i<QUESTIONS.length;i++){
      if(QUESTIONS[i].id===id) return QUESTIONS[i];
    }
    return null;
  }

  function runQuestion(){
    var sess = store.session;
    if(!sess || sess.index >= sess.queue.length){
      finishSession();
      return;
    }
    var q = findQuestion(sess.queue[sess.index]);
    if(!q){
      sess.index++;
      saveStore();
      runQuestion();
      return;
    }
    currentAnswered = false;
    goto("quiz");

    byId("progress-count").textContent = (sess.index+1)+"/"+sess.queue.length;
    byId("progress-fill").style.width = Math.round((sess.index/sess.queue.length)*100)+"%";
    byId("subject-tag").textContent = q.subject;
    byId("question-text").textContent = q.question;

    var passageBox = byId("passage-box");
    if(q.passage){
      passageBox.textContent = q.passage;
      show(passageBox);
    }else{
      hide(passageBox);
    }

    var choicesEl = byId("choices");
    choicesEl.innerHTML = "";
    q.choices.forEach(function(choiceText, idx){
      var btn = document.createElement("button");
      btn.className = "choice";
      btn.innerHTML = '<span class="choice-num">'+(idx+1)+'</span><span>'+choiceText+'</span>';
      btn.addEventListener("click", function(){ selectAnswer(q, idx, choicesEl); });
      choicesEl.appendChild(btn);
    });

    hide(byId("feedback-box"));
    byId("feedback-box").classList.remove("show","correct","wrong");
    byId("btn-next").classList.remove("show");
  }

  function selectAnswer(q, idx, choicesEl){
    if(currentAnswered) return;
    currentAnswered = true;

    var isCorrect = idx === q.answer;
    var buttons = choicesEl.querySelectorAll(".choice");
    buttons.forEach(function(btn, i){
      btn.classList.add("disabled");
      if(i === q.answer) btn.classList.add("correct");
      else if(i === idx) btn.classList.add("wrong");
      else btn.classList.add("dim");
    });

    // 통계 업데이트
    if(!store.stats[q.subject]) store.stats[q.subject] = {correct:0, total:0};
    store.stats[q.subject].total++;
    if(isCorrect) store.stats[q.subject].correct++;

    // 오답노트 업데이트
    var wrongIdx = store.wrongIds.indexOf(q.id);
    if(isCorrect){
      if(wrongIdx>-1) store.wrongIds.splice(wrongIdx,1);
    }else{
      if(wrongIdx===-1) store.wrongIds.push(q.id);
    }

    // 세션 로그
    var sess = store.session;
    sess.log.push({ id:q.id, question:q.question, correct:isCorrect });
    if(isCorrect) sess.correctCount++;

    saveStore();

    var fb = byId("feedback-box");
    var label = byId("feedback-label");
    var text = byId("feedback-text");
    fb.classList.remove("correct","wrong");
    fb.classList.add(isCorrect ? "correct" : "wrong", "show");
    label.textContent = isCorrect ? "정답이에요" : "아쉬워요, 오답이에요";
    text.textContent = q.explanation || "";

    byId("btn-next").classList.add("show");
  }

  function nextQuestion(){
    var sess = store.session;
    sess.index++;
    saveStore();
    runQuestion();
  }

  function finishSession(){
    var sess = store.session;
    var total = sess.queue.length;
    var correct = sess.correctCount;

    byId("result-total-label").innerHTML = correct+"<span> / "+total+"</span>";
    var pct = total>0 ? Math.round((correct/total)*100) : 0;
    var caption = pct>=80 ? "잘 구워졌어요!" : (pct>=50 ? "조금만 더 반죽해봐요" : "이 판은 다시 한번 풀어봐요");
    byId("result-caption").textContent = caption+" · 정답률 "+pct+"%";

    var list = byId("result-list");
    list.innerHTML = "";
    sess.log.forEach(function(item){
      var row = document.createElement("div");
      row.className = "result-item";
      row.innerHTML =
        '<span class="result-mark '+(item.correct?"o":"x")+'">'+(item.correct?"O":"X")+'</span>'+
        '<span class="result-item-text">'+item.question+'</span>';
      list.appendChild(row);
    });

    store.session = null;
    saveStore();
    goto("result");
  }

  // ---------- 이벤트 바인딩 ----------
  byId("btn-new").addEventListener("click", startNewSession);
  byId("btn-wrong").addEventListener("click", startWrongSession);
  byId("btn-continue").addEventListener("click", continueSession);
  byId("btn-next").addEventListener("click", nextQuestion);
  byId("btn-result-home").addEventListener("click", function(){
    renderHome();
    goto("home");
  });
  byId("btn-quit").addEventListener("click", function(){
    // 세션은 store.session에 이미 저장돼 있어 이어하기 가능
    renderHome();
    goto("home");
  });

  // ---------- 시작 ----------
  renderHome();
  goto("home");
})();
</script>
</body>
</html>
