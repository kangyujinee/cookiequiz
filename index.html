<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5B3A29">
<title>제과산업기사 필기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --flour:#FAF0E1;
    --flour-card:#FFFBF4;
    --crust:#5B3A29;
    --charcoal:#2B211A;
    --caramel:#C17817;
    --caramel-dark:#9C5E10;
    --wheat:#E8C468;
    --jam:#A83232;
    --jam-bg:#F5DEDA;
    --sage:#6B8E5A;
    --sage-bg:#DFE9D6;
    --line:#E4D3B8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--flour);
    color:var(--charcoal);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .hidden{display:none !important;}

  /* ---------- 공통 ---------- */
  h1,h2,h3{
    font-family:'Gowun Batang', serif;
    font-weight:700;
    margin:0;
    color:var(--crust);
  }
  button{font-family:inherit;}
  button:focus-visible, .choice:focus-visible{
    outline:3px solid var(--caramel);
    outline-offset:2px;
  }

  /* ---------- 홈 화면 ---------- */
  .home-header{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:4px;
  }
  .home-header h1{font-size:26px;}
  .home-sub{
    font-size:14px;
    color:#8A7360;
    margin:0 0 24px 0;
  }

  /* 세트 카드 목록 */
  .set-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
  }
  .set-card{
    background:var(--flour-card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px 18px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .set-card:active{transform:scale(.98);}
  .set-card-info{flex:1;min-width:0;}
  .set-card-name{
    font-size:16px;
    font-weight:700;
    color:var(--crust);
    margin-bottom:6px;
  }
  .set-card-bar-wrap{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .set-bar{
    flex:1;
    height:7px;
    border-radius:5px;
    background:#F0E4CC;
    overflow:hidden;
  }
  .set-bar-fill{
    height:100%;
    border-radius:5px;
    background:linear-gradient(90deg, var(--wheat), var(--caramel));
    transition:width .5s ease;
  }
  .set-pct{
    font-size:12px;
    font-weight:600;
    color:var(--caramel-dark);
    flex-shrink:0;
    width:36px;
    text-align:right;
  }
  .set-count{
    font-size:11.5px;
    color:#A8927A;
    margin-top:3px;
  }
  .set-arrow{
    font-size:20px;
    color:var(--caramel);
    flex-shrink:0;
  }
  /* 세션 저장 뱃지 */
  .set-badge{
    display:inline-block;
    background:var(--crust);
    color:var(--flour);
    font-size:10px;
    font-weight:700;
    border-radius:999px;
    padding:2px 8px;
    margin-left:7px;
    vertical-align:middle;
    letter-spacing:.02em;
  }

  /* ---------- 오답풀기 버튼 ---------- */
  .wrong-btn-wrap{margin-bottom:8px;}
  .menu-btn{
    background:var(--flour-card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
    text-align:left;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    transition:transform .12s ease;
  }
  .menu-btn:active{transform:scale(.98);}
  .menu-btn:disabled{opacity:.45;cursor:default;}
  .menu-btn-title{font-size:16px;font-weight:700;color:var(--crust);margin-bottom:2px;}
  .menu-btn-desc{font-size:12.5px;color:#8A7360;}
  .menu-arrow{font-size:18px;color:var(--caramel);flex-shrink:0;margin-left:12px;}

  .footer-note{
    margin-top:auto;
    padding-top:24px;
    font-size:11.5px;
    color:#B3A188;
    text-align:center;
    line-height:1.6;
  }

  /* ---------- 바텀시트 오버레이 ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(43,33,26,.45);
    z-index:100;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    animation:overlayIn .2s ease;
  }
  @keyframes overlayIn{from{background:rgba(43,33,26,0);}to{background:rgba(43,33,26,.45);}}
  .sheet{
    width:100%;
    max-width:480px;
    background:var(--flour-card);
    border-radius:24px 24px 0 0;
    padding:20px 20px calc(28px + env(safe-area-inset-bottom));
    animation:sheetUp .22s ease;
  }
  @keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet-handle{
    width:36px;
    height:4px;
    border-radius:99px;
    background:var(--line);
    margin:0 auto 18px;
  }
  .sheet-title{
    font-family:'Gowun Batang', serif;
    font-size:18px;
    font-weight:700;
    color:var(--crust);
    margin-bottom:16px;
    text-align:center;
  }
  .sheet-btns{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .sheet-btn{
    background:var(--flour);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:15px 18px;
    font-size:15px;
    font-weight:600;
    color:var(--crust);
    text-align:left;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    transition:background .12s ease;
  }
  .sheet-btn:active{background:#F5EBD8;}
  .sheet-btn:disabled{opacity:.4;cursor:default;}
  .sheet-btn.primary{
    background:var(--crust);
    border-color:var(--crust);
    color:var(--flour);
  }
  .sheet-btn.primary:active{background:var(--charcoal);}
  .sheet-btn-icon{font-size:20px;flex-shrink:0;}
  .sheet-btn-body{flex:1;}
  .sheet-btn-label{font-size:15px;font-weight:700;}
  .sheet-btn-sub{font-size:12px;color:#A8927A;margin-top:2px;}
  .sheet-btn.primary .sheet-btn-sub{color:#D8C4AC;}
  .sheet-cancel{
    margin-top:6px;
    background:none;
    border:none;
    color:#A8927A;
    font-size:14px;
    font-weight:600;
    width:100%;
    padding:10px;
    cursor:pointer;
    border-radius:10px;
  }
  .sheet-cancel:active{background:#F0E4CC;}

  /* ---------- 퀴즈 화면 ---------- */
  .quiz-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .quit-btn{
    background:none;
    border:none;
    font-size:20px;
    color:var(--crust);
    cursor:pointer;
    padding:4px 6px;
    line-height:1;
  }
  .progress-track{
    flex:1;
    height:8px;
    border-radius:5px;
    background:#F0E4CC;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--wheat), var(--caramel));
    border-radius:5px;
    transition:width .3s ease;
  }
  .progress-count{
    font-size:12.5px;
    font-weight:600;
    color:var(--caramel-dark);
    flex-shrink:0;
    min-width:40px;
    text-align:right;
  }
  .subject-tag{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    color:var(--caramel-dark);
    background:#F3E3C4;
    border-radius:999px;
    padding:4px 12px;
    margin-bottom:14px;
  }
  .question-text{
    font-family:'Gowun Batang', serif;
    font-size:19px;
    line-height:1.55;
    color:var(--charcoal);
    margin-bottom:16px;
  }
  .passage-box{
    background:#F3E9D6;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    font-size:14.5px;
    line-height:1.8;
    color:var(--crust);
    margin-bottom:18px;
    white-space:pre-wrap;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:18px;
  }
  .choice{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--flour-card);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    font-size:15px;
    text-align:left;
    color:var(--charcoal);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .choice-num{
    width:24px;
    height:24px;
    border-radius:50%;
    background:#F0E4CC;
    color:var(--crust);
    font-size:12.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .choice:active{background:#F5EBD8;}
  .choice.correct{background:var(--sage-bg);border-color:var(--sage);}
  .choice.correct .choice-num{background:var(--sage);color:#fff;}
  .choice.wrong{background:var(--jam-bg);border-color:var(--jam);}
  .choice.wrong .choice-num{background:var(--jam);color:#fff;}
  .choice.disabled{cursor:default;}
  .choice.dim{opacity:.5;}

  .feedback-box{
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:18px;
    display:none;
  }
  .feedback-box.show{display:block;animation:fadeIn .2s ease;}
  .feedback-box.correct{background:var(--sage-bg);}
  .feedback-box.wrong{background:var(--jam-bg);}
  .feedback-label{font-size:13.5px;font-weight:700;margin-bottom:6px;}
  .feedback-box.correct .feedback-label{color:#3F5A34;}
  .feedback-box.wrong .feedback-label{color:#7A2424;}
  .feedback-text{font-size:14px;line-height:1.6;color:var(--charcoal);}

  .next-btn{
    margin-top:auto;
    background:var(--crust);
    color:var(--flour);
    border:none;
    border-radius:14px;
    padding:16px;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
    display:none;
  }
  .next-btn.show{display:block;animation:fadeIn .2s ease;}
  .next-btn:active{background:var(--charcoal);}

  /* ---------- 결과 화면 ---------- */
  .result-hero{text-align:center;padding:12px 0 28px;}
  .result-score{
    font-family:'Gowun Batang', serif;
    font-size:52px;
    font-weight:700;
    color:var(--caramel);
    line-height:1;
  }
  .result-score span{font-size:22px;color:#B3A188;font-weight:400;}
  .result-caption{margin-top:10px;font-size:14px;color:#8A7360;}
  .result-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
  .result-item{
    background:var(--flour-card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:13.5px;
  }
  .result-mark{
    flex-shrink:0;
    width:20px;height:20px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#fff;margin-top:1px;
  }
  .result-mark.o{background:var(--sage);}
  .result-mark.x{background:var(--jam);}
  .result-item-text{color:var(--charcoal);line-height:1.5;}
  .result-actions{display:flex;flex-direction:column;gap:10px;margin-top:auto;}
</style>
</head>
<body>
<div id="app">

  <!-- ===== 홈 화면 ===== -->
  <div id="screen-home" class="screen">
    <div class="home-header">
      <h1>🍞 민규 화이탱..</h1>
    </div>
    <p class="home-sub">제과산업기사 필기</p>

    <!-- 세트 카드 목록 (JS로 렌더) -->
    <div class="set-list" id="set-list"></div>

    <!-- 오답 풀기 -->
    <div class="wrong-btn-wrap">
      <button class="menu-btn" id="btn-wrong">
        <div>
          <div class="menu-btn-title">틀린 문제만 다시 풀기</div>
          <div class="menu-btn-desc" id="wrong-desc">0문제 저장됨</div>
        </div>
        <span class="menu-arrow">›</span>
      </button>
    </div>

    <p class="footer-note">진행 상황은 이 기기의 브라우저에만 저장돼요.<br>홈 화면에 추가해두면 앱처럼 쓸 수 있어요.</p>
  </div>

  <!-- ===== 퀴즈 화면 ===== -->
  <div id="screen-quiz" class="screen hidden">
    <div class="quiz-top">
      <button class="quit-btn" id="btn-quit" aria-label="홈으로">←</button>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-count" id="progress-count">1/10</div>
    </div>

    <span class="subject-tag" id="subject-tag">과목</span>
    <div class="question-text" id="question-text">문제 텍스트</div>
    <div class="passage-box hidden" id="passage-box"></div>

    <div class="choices" id="choices"></div>

    <div class="feedback-box" id="feedback-box">
      <div class="feedback-label" id="feedback-label"></div>
      <div class="feedback-text" id="feedback-text"></div>
    </div>

    <button class="next-btn" id="btn-next">다음 문제</button>
  </div>

  <!-- ===== 결과 화면 ===== -->
  <div id="screen-result" class="screen hidden">
    <div class="result-hero">
      <div class="result-score"><span id="result-total-label"></span></div>
      <div class="result-caption" id="result-caption"></div>
    </div>
    <div class="result-list" id="result-list"></div>
    <div class="result-actions">
      <button class="menu-btn" id="btn-result-home" style="background:var(--crust);border-color:var(--crust);">
        <div><div class="menu-btn-title" style="color:var(--flour);">홈으로</div></div>
        <span class="menu-arrow" style="color:var(--wheat);">›</span>
      </button>
    </div>
  </div>

  <!-- ===== 바텀시트 오버레이 ===== -->
  <div id="overlay" class="overlay hidden">
    <div class="sheet" id="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="sheet-title"></div>
      <div class="sheet-btns" id="sheet-btns"></div>
    </div>
  </div>

</div>

<script src="questions.js"></script>
<script>
(function(){
  "use strict";

  var STORAGE_KEY = "breadquiz_v2";

  // ---------- 저장 데이터 ----------
  function loadStore(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultStore();
      return Object.assign(defaultStore(), JSON.parse(raw));
    }catch(e){ return defaultStore(); }
  }
  function defaultStore(){
    return {
      setStats: {},   // { setName: { answered: [id,...], correct: [id,...] } }
      wrongIds: [],   // 틀린 문제 id 배열
      sessions: {}    // { setName: { queue, index, correctCount, log, mode } }
    };
  }
  function saveStore(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
  var store = loadStore();

  // ---------- 유틸 ----------
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function byId(id){ return document.getElementById(id); }
  function show(el){ el.classList.remove("hidden"); }
  function hide(el){ el.classList.add("hidden"); }

  var screens = {
    home: byId("screen-home"),
    quiz: byId("screen-quiz"),
    result: byId("screen-result")
  };
  function goto(name){
    Object.keys(screens).forEach(function(k){
      if(k===name) show(screens[k]); else hide(screens[k]);
    });
    window.scrollTo(0,0);
  }

  // ---------- 문제 세트 목록 추출 ----------
  function getSets(){
    if(!window.QUESTIONS || !QUESTIONS.length) return [];
    var order = [], seen = {};
    QUESTIONS.forEach(function(q){
      var s = q.set || "기타";
      if(!seen[s]){ seen[s]=true; order.push(s); }
    });
    return order;
  }
  function getSetQuestions(setName){
    if(!window.QUESTIONS) return [];
    return QUESTIONS.filter(function(q){ return (q.set||"기타")===setName; });
  }
  function findQuestion(id){
    if(!window.QUESTIONS) return null;
    for(var i=0;i<QUESTIONS.length;i++) if(QUESTIONS[i].id===id) return QUESTIONS[i];
    return null;
  }

  // ---------- 홈 렌더 ----------
  function renderHome(){
    var sets = getSets();
    var listEl = byId("set-list");
    listEl.innerHTML = "";

    if(sets.length === 0){
      var empty = document.createElement("div");
      empty.style.cssText = "font-size:14px;color:#A8927A;text-align:center;padding:32px 0;";
      empty.textContent = "아직 등록된 문제가 없어요. questions.js를 추가해주세요.";
      listEl.appendChild(empty);
    } else {
      sets.forEach(function(setName){
        var qs = getSetQuestions(setName);
        var total = qs.length;
        var stat = store.setStats[setName] || { answered:[], correct:[] };
        var answeredCount = stat.answered.length;
        var pct = total > 0 ? Math.round((answeredCount / total) * 100) : 0;
        var hasSess = !!(store.sessions[setName] &&
                         store.sessions[setName].queue &&
                         store.sessions[setName].index < store.sessions[setName].queue.length);

        var card = document.createElement("button");
        card.className = "set-card";
        card.innerHTML =
          '<div class="set-card-info">'+
            '<div class="set-card-name">'+setName+
              (hasSess ? '<span class="set-badge">이어하기</span>' : '')+
            '</div>'+
            '<div class="set-card-bar-wrap">'+
              '<div class="set-bar"><div class="set-bar-fill" style="width:'+pct+'%"></div></div>'+
              '<div class="set-pct">'+pct+'%</div>'+
            '</div>'+
            '<div class="set-count">'+answeredCount+' / '+total+'문제 완료</div>'+
          '</div>'+
          '<div class="set-arrow">›</div>';
        card.addEventListener("click", function(){ openSetSheet(setName, hasSess); });
        listEl.appendChild(card);
      });
    }

    // 오답 버튼
    var wrongCount = store.wrongIds.length;
    byId("wrong-desc").textContent = wrongCount + "문제 저장됨";
    byId("btn-wrong").disabled = wrongCount === 0;
  }

  // ---------- 바텀시트 ----------
  var overlayEl = byId("overlay");
  var currentSetForSheet = null;
  var sheetStep = null; // "main" | "new-order"

  function openSheet(title, btns){
    byId("sheet-title").textContent = title;
    var container = byId("sheet-btns");
    container.innerHTML = "";
    btns.forEach(function(b){
      var el = document.createElement("button");
      el.className = "sheet-btn" + (b.primary ? " primary" : "");
      el.disabled = !!b.disabled;
      el.innerHTML =
        '<span class="sheet-btn-icon">'+b.icon+'</span>'+
        '<div class="sheet-btn-body">'+
          '<div class="sheet-btn-label">'+b.label+'</div>'+
          (b.sub ? '<div class="sheet-btn-sub">'+b.sub+'</div>' : '')+
        '</div>';
      if(!b.disabled) el.addEventListener("click", b.action);
      container.appendChild(el);
    });
    // 취소 버튼
    var cancel = document.createElement("button");
    cancel.className = "sheet-cancel";
    cancel.textContent = "취소";
    cancel.addEventListener("click", closeSheet);
    container.appendChild(cancel);
    show(overlayEl);
  }
  function closeSheet(){
    hide(overlayEl);
    currentSetForSheet = null;
    sheetStep = null;
  }
  overlayEl.addEventListener("click", function(e){
    if(e.target === overlayEl) closeSheet();
  });

  // 1단계: 세트 선택 후 → 새로풀기 / 이어풀기
  function openSetSheet(setName, hasSess){
    currentSetForSheet = setName;
    sheetStep = "main";
    var sess = store.sessions[setName];
    var sessSub = hasSess ? ((sess.index+1)+" / "+sess.queue.length+"번째 문제부터") : null;
    openSheet(setName, [
      {
        icon:"✨",
        label:"새로 풀기",
        sub:"처음부터 다시 시작",
        primary:true,
        action:function(){ openNewOrderSheet(setName); }
      },
      {
        icon:"▶️",
        label:"이어 풀기",
        sub: hasSess ? sessSub : "저장된 세션 없음",
        disabled: !hasSess,
        action:function(){ closeSheet(); startContinueSession(setName); }
      }
    ]);
  }

  // 2단계: 새로풀기 → 랜덤 / 원래순서
  function openNewOrderSheet(setName){
    sheetStep = "new-order";
    openSheet("문제 순서 선택", [
      {
        icon:"🔀",
        label:"랜덤으로 풀기",
        sub:"문제 순서를 섞어서 출제",
        primary:true,
        action:function(){ closeSheet(); startNewSession(setName, true); }
      },
      {
        icon:"📋",
        label:"원래 순서로 풀기",
        sub:"문제지 순서 그대로",
        action:function(){ closeSheet(); startNewSession(setName, false); }
      }
    ]);
  }

  // ---------- 세션 시작 ----------
  function startNewSession(setName, doShuffle){
    var qs = getSetQuestions(setName);
    if(!qs.length){
      alert("이 세트에 등록된 문제가 없어요.");
      return;
    }
    var ids = qs.map(function(q){ return q.id; });
    var queue = doShuffle ? shuffle(ids) : ids;
    store.sessions[setName] = {
      setName: setName,
      queue: queue,
      index: 0,
      correctCount: 0,
      log: [],
      mode: doShuffle ? "random" : "ordered"
    };
    saveStore();
    runQuestion(setName);
  }

  function startContinueSession(setName){
    if(!store.sessions[setName]) return;
    runQuestion(setName);
  }

  function startWrongSession(){
    if(!window.QUESTIONS) return;
    var idSet = {};
    var queue = store.wrongIds.filter(function(id){
      if(idSet[id]) return false;
      idSet[id] = true;
      return QUESTIONS.some(function(q){ return q.id===id; });
    });
    if(!queue.length){ alert("틀린 문제가 없어요."); return; }
    // wrong은 글로벌 세션 키 "_wrong" 사용
    store.sessions["_wrong"] = {
      setName: "_wrong",
      queue: shuffle(queue),
      index: 0,
      correctCount: 0,
      log: [],
      mode: "wrong"
    };
    saveStore();
    runQuestion("_wrong");
  }

  // ---------- 퀴즈 진행 ----------
  var currentAnswered = false;
  var currentSetKey = null;

  function runQuestion(setKey){
    currentSetKey = setKey;
    var sess = store.sessions[setKey];
    if(!sess || sess.index >= sess.queue.length){
      finishSession(setKey);
      return;
    }
    var q = findQuestion(sess.queue[sess.index]);
    if(!q){
      sess.index++;
      saveStore();
      runQuestion(setKey);
      return;
    }
    currentAnswered = false;
    goto("quiz");

    byId("progress-count").textContent = (sess.index+1)+"/"+sess.queue.length;
    byId("progress-fill").style.width = Math.round((sess.index/sess.queue.length)*100)+"%";
    byId("subject-tag").textContent = q.subject || (q.set || "");
    byId("question-text").textContent = q.question;

    var passageBox = byId("passage-box");
    if(q.passage){ passageBox.textContent = q.passage; show(passageBox); }
    else{ hide(passageBox); }

    var choicesEl = byId("choices");
    choicesEl.innerHTML = "";
    q.choices.forEach(function(choiceText, idx){
      var btn = document.createElement("button");
      btn.className = "choice";
      btn.innerHTML = '<span class="choice-num">'+(idx+1)+'</span><span>'+choiceText+'</span>';
      btn.addEventListener("click", function(){ selectAnswer(q, idx, choicesEl, setKey); });
      choicesEl.appendChild(btn);
    });

    hide(byId("feedback-box"));
    byId("feedback-box").classList.remove("show","correct","wrong");
    byId("btn-next").classList.remove("show");
  }

  function selectAnswer(q, idx, choicesEl, setKey){
    if(currentAnswered) return;
    currentAnswered = true;

    var isCorrect = idx === q.answer;
    var buttons = choicesEl.querySelectorAll(".choice");
    buttons.forEach(function(btn, i){
      btn.classList.add("disabled");
      if(i === q.answer) btn.classList.add("correct");
      else if(i === idx) btn.classList.add("wrong");
      else btn.classList.add("dim");
    });

    // 세트별 통계 (wrong 세션 제외)
    if(setKey !== "_wrong"){
      if(!store.setStats[setKey]) store.setStats[setKey] = { answered:[], correct:[] };
      var stat = store.setStats[setKey];
      if(stat.answered.indexOf(q.id) === -1) stat.answered.push(q.id);
      if(isCorrect && stat.correct.indexOf(q.id) === -1) stat.correct.push(q.id);
    }

    // 오답노트
    var wIdx = store.wrongIds.indexOf(q.id);
    if(isCorrect){ if(wIdx>-1) store.wrongIds.splice(wIdx,1); }
    else{ if(wIdx===-1) store.wrongIds.push(q.id); }

    // 세션 로그
    var sess = store.sessions[setKey];
    sess.log.push({ id:q.id, question:q.question, correct:isCorrect });
    if(isCorrect) sess.correctCount++;
    saveStore();

    var fb = byId("feedback-box");
    fb.classList.remove("correct","wrong");
    fb.classList.add(isCorrect ? "correct" : "wrong", "show");
    byId("feedback-label").textContent = isCorrect ? "정답이에요" : "아쉬워요, 오답이에요";
    byId("feedback-text").textContent = q.explanation || "";
    byId("btn-next").classList.add("show");
  }

  function nextQuestion(){
    var sess = store.sessions[currentSetKey];
    sess.index++;
    saveStore();
    runQuestion(currentSetKey);
  }

  function finishSession(setKey){
    var sess = store.sessions[setKey];
    var total = sess.queue.length;
    var correct = sess.correctCount;

    byId("result-total-label").innerHTML = correct+"<span> / "+total+"</span>";
    var pct = total>0 ? Math.round((correct/total)*100) : 0;
    var caption = pct>=80 ? "잘 구워졌어요!" : (pct>=50 ? "조금만 더 반죽해봐요" : "이 판은 다시 한번 풀어봐요");
    byId("result-caption").textContent = caption+" · 정답률 "+pct+"%";

    var list = byId("result-list");
    list.innerHTML = "";
    sess.log.forEach(function(item){
      var row = document.createElement("div");
      row.className = "result-item";
      row.innerHTML =
        '<span class="result-mark '+(item.correct?"o":"x")+'">'+(item.correct?"O":"X")+'</span>'+
        '<span class="result-item-text">'+item.question+'</span>';
      list.appendChild(row);
    });

    // 세션 지우기 (완료됐으므로 이어하기 불필요)
    delete store.sessions[setKey];
    saveStore();
    goto("result");
  }

  // ---------- 이벤트 ----------
  byId("btn-wrong").addEventListener("click", startWrongSession);
  byId("btn-next").addEventListener("click", nextQuestion);
  byId("btn-result-home").addEventListener("click", function(){
    renderHome();
    goto("home");
  });
  byId("btn-quit").addEventListener("click", function(){
    // 세션은 store.sessions에 보존 → 이어하기 가능
    renderHome();
    goto("home");
  });

  // ---------- 시작 ----------
  renderHome();
  goto("home");
})();
</script>
</body>
</html>
