<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5B3A29">
<title>굽기 연습 — 제빵산업기사 필기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --flour:#FAF0E1;
    --flour-card:#FFFBF4;
    --crust:#5B3A29;
    --charcoal:#2B211A;
    --caramel:#C17817;
    --caramel-dark:#9C5E10;
    --wheat:#E8C468;
    --jam:#A83232;
    --jam-bg:#F5DEDA;
    --sage:#6B8E5A;
    --sage-bg:#DFE9D6;
    --line:#E4D3B8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--flour);
    color:var(--charcoal);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .hidden{display:none !important;}

  /* ---------- 공통 ---------- */
  h1,h2,h3{
    font-family:'Gowun Batang', serif;
    font-weight:700;
    margin:0;
    color:var(--crust);
  }
  button{font-family:inherit;}
  button:focus-visible, .choice:focus-visible{
    outline:3px solid var(--caramel);
    outline-offset:2px;
  }

  /* ---------- 홈 화면 ---------- */
  .home-header{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:4px;
  }
  .home-header h1{font-size:26px;}
  .home-sub{
    font-size:14px;
    color:#8A7360;
    margin:0 0 28px 0;
  }
  .no-data{
    font-size:13px;
    color:#A8927A;
  }

  .menu-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:8px;
  }
  .menu-btn{
    background:var(--flour-card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
    text-align:left;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .menu-btn:active{transform:scale(.98);}
  .menu-btn.primary{
    background:var(--crust);
    border-color:var(--crust);
  }
  .menu-btn.primary .menu-btn-title{color:var(--flour);}
  .menu-btn.primary .menu-btn-desc{color:#D8C4AC;}
  .menu-btn:disabled{opacity:.45;cursor:default;}
  .menu-btn-title{
    font-size:16px;
    font-weight:700;
    color:var(--crust);
    margin-bottom:2px;
  }
  .menu-btn-desc{
    font-size:12.5px;
    color:#8A7360;
  }
  .menu-arrow{
    font-size:18px;
    color:var(--caramel);
    flex-shrink:0;
    margin-left:12px;
  }
  .menu-btn.primary .menu-arrow{color:var(--wheat);}

  .footer-note{
    margin-top:auto;
    padding-top:24px;
    font-size:11.5px;
    color:#B3A188;
    text-align:center;
    line-height:1.6;
  }

  /* ---------- 퀴즈 화면 ---------- */
  .quiz-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .quit-btn{
    background:none;
    border:none;
    font-size:20px;
    color:var(--crust);
    cursor:pointer;
    padding:4px 6px;
    line-height:1;
  }
  .progress-track{
    flex:1;
    height:8px;
    border-radius:5px;
    background:#F0E4CC;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--wheat), var(--caramel));
    border-radius:5px;
    transition:width .3s ease;
  }
  .progress-count{
    font-size:12.5px;
    font-weight:600;
    color:var(--caramel-dark);
    flex-shrink:0;
    min-width:40px;
    text-align:right;
  }
  .subject-tag{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    color:var(--caramel-dark);
    background:#F3E3C4;
    border-radius:999px;
    padding:4px 12px;
    margin-bottom:14px;
  }
  .question-text{
    font-family:'Gowun Batang', serif;
    font-size:19px;
    line-height:1.55;
    color:var(--charcoal);
    margin-bottom:16px;
  }
  .passage-box{
    background:#F3E9D6;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    font-size:14.5px;
    line-height:1.8;
    color:var(--crust);
    margin-bottom:18px;
    white-space:pre-wrap;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:18px;
  }
  .choice{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--flour-card);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    font-size:15px;
    text-align:left;
    color:var(--charcoal);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .choice-num{
    width:24px;
    height:24px;
    border-radius:50%;
    background:#F0E4CC;
    color:var(--crust);
    font-size:12.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .choice:active{background:#F5EBD8;}
  .choice.correct{
    background:var(--sage-bg);
    border-color:var(--sage);
  }
  .choice.correct .choice-num{background:var(--sage);color:#fff;}
  .choice.wrong{
    background:var(--jam-bg);
    border-color:var(--jam);
  }
  .choice.wrong .choice-num{background:var(--jam);color:#fff;}
  .choice.disabled{cursor:default;}
  .choice.dim{opacity:.5;}

  .feedback-box{
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:18px;
    display:none;
  }
  .feedback-box.show{display:block;animation:fadeIn .2s ease;}
  .feedback-box.correct{background:var(--sage-bg);}
  .feedback-box.wrong{background:var(--jam-bg);}
  .feedback-label{
    font-size:13.5px;
    font-weight:700;
    margin-bottom:6px;
  }
  .feedback-box.correct .feedback-label{color:#3F5A34;}
  .feedback-box.wrong .feedback-label{color:#7A2424;}
  .feedback-text{
    font-size:14px;
    line-height:1.6;
    color:var(--charcoal);
  }

  .next-btn{
    margin-top:auto;
    background:var(--crust);
    color:var(--flour);
    border:none;
    border-radius:14px;
    padding:16px;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
    display:none;
  }
  .next-btn.show{display:block;animation:fadeIn .2s ease;}
  .next-btn:active{background:var(--charcoal);}

  /* ---------- 결과 화면 ---------- */
  .result-hero{
    text-align:center;
    padding:12px 0 28px;
  }
  .result-score{
    font-family:'Gowun Batang', serif;
    font-size:52px;
    font-weight:700;
    color:var(--caramel);
    line-height:1;
  }
  .result-score span{font-size:22px;color:#B3A188;font-weight:400;}
  .result-caption{
    margin-top:10px;
    font-size:14px;
    color:#8A7360;
  }
  .result-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:20px;
  }
  .result-item{
    background:var(--flour-card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:13.5px;
  }
  .result-mark{
    flex-shrink:0;
    width:20px;
    height:20px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:700;
    color:#fff;
    margin-top:1px;
  }
  .result-mark.o{background:var(--sage);}
  .result-mark.x{background:var(--jam);}
  .result-item-text{color:var(--charcoal);line-height:1.5;}

  .result-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:auto;
  }

  /* ---------- set 카드 ---------- */
  .set-card{
    background:var(--flour-card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
    text-align:left;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:transform .12s ease;
  }
  .set-card:active{transform:scale(.98);}
  .set-card-info{flex:1;min-width:0;}
  .set-card-name{
    font-size:16px;
    font-weight:700;
    color:var(--crust);
    margin-bottom:6px;
  }
  .set-card-bar-wrap{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .set-bake-bar{
    flex:1;
    height:7px;
    border-radius:5px;
    background:#F0E4CC;
    overflow:hidden;
  }
  .set-bake-bar-fill{
    height:100%;
    border-radius:5px;
    background:linear-gradient(90deg, var(--wheat), var(--caramel));
    transition:width .5s ease;
  }
  .set-card-pct{
    font-size:12.5px;
    font-weight:600;
    color:var(--caramel-dark);
    flex-shrink:0;
    min-width:36px;
    text-align:right;
  }
  .set-card-count{
    font-size:12px;
    color:#A8927A;
    margin-top:3px;
  }

  /* ---------- 모달 ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(43,33,26,.45);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
    animation:fadeIn .2s ease;
  }
  .modal-box{
    background:var(--flour-card);
    border-radius:22px 22px 0 0;
    padding:28px 20px calc(28px + env(safe-area-inset-bottom));
    width:100%;
    max-width:480px;
  }
  .modal-title{
    font-family:'Gowun Batang', serif;
    font-size:19px;
    font-weight:700;
    color:var(--crust);
    margin-bottom:6px;
    text-align:center;
  }
  .modal-progress{
    font-size:13px;
    color:#8A7360;
    text-align:center;
    margin-bottom:20px;
  }
  .modal-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:10px;
  }
  .modal-btn{
    width:100%;
    background:var(--flour-card);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:15px;
    font-size:15.5px;
    font-weight:700;
    color:var(--crust);
    cursor:pointer;
    transition:background .12s ease;
  }
  .modal-btn.primary{
    background:var(--crust);
    border-color:var(--crust);
    color:var(--flour);
  }
  .modal-btn:disabled{
    opacity:.4;
    cursor:default;
  }
  .modal-btn:not(:disabled):active{opacity:.82;}
  .modal-close{
    width:100%;
    background:none;
    border:none;
    padding:12px;
    font-size:14px;
    color:#A8927A;
    cursor:pointer;
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===== 홈 화면 ===== -->
  <div id="screen-home" class="screen">
    <div class="home-header">
      <h1>🍞 굽기 연습</h1>
    </div>
    <p class="home-sub">제빵산업기사 필기, 출퇴근길에 한 판씩</p>

    <div id="set-list" class="menu-list"></div>

    <div class="menu-list" style="margin-top:16px;">
      <button class="menu-btn" id="btn-wrong">
        <div>
          <div class="menu-btn-title">틀린 문제만 다시 풀기</div>
          <div class="menu-btn-desc" id="wrong-desc">0문제 저장됨</div>
        </div>
        <span class="menu-arrow">›</span>
      </button>
    </div>

    <!-- set 선택 모달 -->
    <div id="set-modal-overlay" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="modal-title" id="modal-set-name"></div>
        <div class="modal-progress" id="modal-set-progress"></div>
        <div class="modal-actions">
          <button class="modal-btn primary" id="modal-btn-new">새로 풀기</button>
          <button class="modal-btn" id="modal-btn-continue">이어 풀기</button>
        </div>
        <button class="modal-close" id="modal-close">취소</button>
      </div>
    </div>

    <!-- 새로풀기 순서 선택 모달 -->
    <div id="order-modal-overlay" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="modal-title">문제 순서 선택</div>
        <div class="modal-actions">
          <button class="modal-btn primary" id="order-btn-random">🔀 랜덤으로 풀기</button>
          <button class="modal-btn" id="order-btn-original">📋 원래 순서로 풀기</button>
        </div>
        <button class="modal-close" id="order-close">취소</button>
      </div>
    </div>

    <p class="footer-note">진행 상황은 이 기기의 브라우저에만 저장돼요.<br>홈 화면에 추가해두면 앱처럼 쓸 수 있어요.</p>
  </div>

  <!-- ===== 퀴즈 화면 ===== -->
  <div id="screen-quiz" class="screen hidden">
    <div class="quiz-top">
      <button class="quit-btn" id="btn-quit" aria-label="홈으로">←</button>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-count" id="progress-count">1/10</div>
    </div>

    <span class="subject-tag" id="subject-tag">과목</span>
    <div class="question-text" id="question-text">문제 텍스트</div>
    <div class="passage-box hidden" id="passage-box"></div>

    <div class="choices" id="choices"></div>

    <div class="feedback-box" id="feedback-box">
      <div class="feedback-label" id="feedback-label"></div>
      <div class="feedback-text" id="feedback-text"></div>
    </div>

    <button class="next-btn" id="btn-next">다음 문제</button>
  </div>

  <!-- ===== 결과 화면 ===== -->
  <div id="screen-result" class="screen hidden">
    <div class="result-hero">
      <div class="result-score"><span id="result-total-label"></span></div>
      <div class="result-caption" id="result-caption"></div>
    </div>
    <div class="result-list" id="result-list"></div>
    <div class="result-actions">
      <button class="menu-btn primary" id="btn-result-home">
        <div><div class="menu-btn-title">홈으로</div></div>
        <span class="menu-arrow">›</span>
      </button>
    </div>
  </div>

</div>

<script>
// 제과산업기사 기출복원문제
// 스키마: { id, set, subject, question, passage(선택), choices, answer, explanation }
// set: 시험 회차 (예: "3회")
// subject: 과목명 (추후 입력)
// answer: choices 배열의 인덱스 (0부터 시작)

const QUESTIONS = [
  { id: "round3-001", set: "2024 3회", subject: "", question: "다음 조건에서 얼음 사용량을 구하면?", passage: "실내 온도: 25℃, 밀가루 온도: 25℃, 달걀 온도: 20℃, 설탕 온도: 25℃, 수돗물 온도: 23℃, 버터 온도: 20℃, 마찰계수: 20, 희망 반죽 온도: 23℃, 사용할 물의 양: 80g", choices: ["8g", "12g", "16g", "20g"], answer: 2, explanation: "사용할 물 온도는 (23×6)-(25+25+20+25+20+20)=3℃이고, 얼음 사용량은 80×(23-3)÷(80+23)≒15.5g이므로 약 16g이다." },
  { id: "round3-002", set: "2024 3회", subject: "", question: "다음 중 냉과 제품은 어느 것인가?", choices: ["마카롱", "에클레어", "바바루아", "스콘"], answer: 2, explanation: "바바루아는 냉장고에 넣어 차게 굳혀 마무리하는 냉과 제품이다." },
  { id: "round3-003", set: "2024 3회", subject: "", question: "무스에 대한 설명 중 잘못 설명한 것은?", choices: ["무스(Mousse)란 프랑스어로 거품이라는 뜻이다.", "크림, 젤라틴, 버터를 주재료로 만든다.", "맛이 풍부하고 향기가 나며 보통 차갑게 먹는다.", "차가운 무스는 보통 과일 퓌레나 초콜릿으로 맛을 낸다."], answer: 2, explanation: "무스의 주재료는 달걀, 설탕을 기본으로 우유, 과즙, 생크림 등이다." },
  { id: "round3-004", set: "2024 3회", subject: "", question: "냉장고, 냉동고 관리 중 틀린 것은?", choices: ["생식품과 조리식품은 구분 보관하며, 냉장고 하단에 안전해야 하는 식재료를 보관하고 상단에 오염도가 심한 식재료를 보관한다.", "냉장·냉동고에 부착된 온도계의 온도는 1일 1회 확인한다.", "냉기의 원활한 순환을 위해 전체 공간의 70%가 넘지 않도록 저장한다.", "디지털 온도계의 감지부는 냉각원에서 가장 멀리 떨어진 위치에 고정하고 본체는 외부에 부착한다."], answer: 0, explanation: "오염물이 아래로 떨어질 수 있으므로 상단에는 안전해야 하는 식재료를, 하단에는 오염도가 심한 식재료를 보관한다." },
  { id: "round3-005", set: "2024 3회", subject: "", question: "퍼프 페이스트리를 성형 후 수축의 원인이 아닌 것은?", choices: ["휴지가 충분하지 않음", "밀어 펴는 작업이 과도한 경우", "된 반죽", "충전용 유지가 너무 무름"], answer: 3, explanation: "충전용 유지가 너무 무르면 유지가 녹아 결 형성이 어려워지고 부피가 작아진다." },
  { id: "round3-006", set: "2024 3회", subject: "", question: "슈 제조 시 반죽에 달걀을 넣어 발생하는 효과가 아닌 것은?", choices: ["팽창 증가", "글루텐 형성 억제", "식감", "수분량 조절"], answer: 1, explanation: "슈 반죽의 달걀은 부드러운 팽창과 식감 및 수분 조절에 도움을 주며, 글루텐 형성 억제는 버터의 효과이다." },
  { id: "round3-007", set: "2024 3회", subject: "", question: "퍼프 페이스트리의 재료가 아닌 것은?", choices: ["밀가루", "이스트", "유지", "소금"], answer: 1, explanation: "퍼프 페이스트리의 주재료는 밀가루, 유지, 물, 소금이다." },

  { id: "round3-009", set: "2024 3회", subject: "", question: "기름에 튀길 때 기름 흡수에 영향을 주는 조건이 아닌 것은?", choices: ["튀김 기름의 온도와 가열 시간", "튀김 재료의 중량", "재료의 성분과 성질", "밀가루의 종류"], answer: 1, explanation: "기름 흡수는 재료의 표면적, 튀김 시간, 당·지방·수분 함량, 박력분 여부 등에 영향을 받는다." },
  { id: "round3-010", set: "2024 3회", subject: "", question: "초콜릿의 블룸(Bloom) 현상 중 Sugar Bloom 원인으로 맞는 것은?", choices: ["초콜릿 가공 과정 중 템퍼링이 충분하지 않았다.", "고온, 직사광선에 의하여 녹음과 굳음이 반복되었다.", "저장 과정 중 지방이 분리되었다가 굳으면서 얼룩이 생기는 현상이다.", "설탕이 공기 중의 수분을 흡수하여 녹았다가 재결정되어 표면이 하얗게 되는 현상이다."], answer: 3, explanation: "Sugar Bloom은 설탕이 수분을 흡수해 녹았다가 재결정되면서 표면이 하얗게 되는 현상이다." },
  { id: "round3-011", set: "2024 3회", subject: "", question: "제품 진열 중 손님이 왔을 때 올바른 대처 방법은?", choices: ["‘어서 오세요’ 하고 인사한다.", "멀뚱히 본다.", "따라다닌다.", "하던 일을 한다."], answer: 0, explanation: "작업 중 손님이 오면 일을 멈추고 눈을 맞추며 웃으면서 반갑게 인사한다." },
  { id: "round3-012", set: "2024 3회", subject: "", question: "쿠키 중 가장 수분이 많은 쿠키는?", choices: ["쇼트 브레드 쿠키", "버터 쿠키", "아이싱 쿠키", "핑거 쿠키"], answer: 3, explanation: "핑거 쿠키는 거품형 쿠키로 공립법으로 제조한다." },

  { id: "round3-014", set: "2024 3회", subject: "", question: "델파이기법에 대한 설명으로 옳지 않은 것은?", choices: ["복수의 전문가 패널을 구성한다.", "각 패널들은 익명으로 유지되어야 하며 의사소통은 우편이나 이메일로 이루어진다.", "다양한 답변을 얻은 연구자는 다시 취합하여 패널들에게 제공하고 비교·분석과 의견 수정 과정을 반복해 일정 결론으로 수렴한다.", "다수의 전문가들이 합의한 내용은 언제나 신뢰도와 신빙성이 높은 실용성 있는 결론이 된다."], answer: 3, explanation: "델파이기법은 합의에 이르기 쉽지 않고, 합의하더라도 실용성 없는 결론이 나올 수 있다." },
  { id: "round3-015", set: "2024 3회", subject: "", question: "식중독 예방원칙 중 안전한 온도에서의 식품 보관에 대한 설명 중 잘못된 것은?", choices: ["조리된 음식은 실온에서 2시간 이상 방치 금지", "조리된 식품 및 부패하기 쉬운 모든 음식은 즉시 냉장보관", "조리된 식품은 40℃ 이상 온도 유지", "상온에서 냉동식품 해동 금지"], answer: 2, explanation: "따뜻하게 먹을 음식은 60℃ 이상, 차갑게 먹을 음식은 5℃ 이하에서 보관한다." },
  { id: "round3-016", set: "2024 3회", subject: "", question: "‘능률적이고 계속적인 생산 활동을 위해 필요한 원재료, 반제품, 제품 등의 최적 보유량을 계획, 조직, 통제하는 기능’을 무엇이라 하는가?", choices: ["생산관리", "구매관리", "재고관리", "품질관리"], answer: 2, explanation: "재고관리는 적정 재고량을 확보·보관하고 기록에 따라 최적으로 유지하는 기능이다." },
  { id: "round3-017", set: "2024 3회", subject: "", question: "다음 중 과일에 들어 있는 단백질 분해 효소가 아닌 것은?", choices: ["펩신", "파파인", "피신", "브로멜린"], answer: 0, explanation: "파파야에는 파파인, 파인애플에는 브로멜린, 무화과에는 피신이 있으며 펩신은 위에서 분비된다." },
  { id: "round3-018", set: "2024 3회", subject: "", question: "반죽형 반죽 중 단단계법의 특징이 아닌 것은?", choices: ["설탕을 많이 사용하는 공장에 유리하다.", "믹싱 방법과 특징을 잘 알아야 한다.", "유화제와 베이킹파우더를 넣어 반죽한다.", "모든 재료를 한 번에 투입한 후 믹싱한다."], answer: 0, explanation: "단단계법은 모든 재료를 한 번에 넣어 반죽하여 노동력과 시간이 절약되지만 설탕을 많이 사용하는 공장에 유리한 방법은 아니다." },
  { id: "round3-019", set: "2024 3회", subject: "", question: "OJT(On-the-Job-Training)에 대한 설명으로 잘못 설명한 것은?", choices: ["영향력 있는 직속 상사가 업무 지식, 기능, 태도 등을 교육한다.", "사측 분위기 파악과 개인 능력개발에 성취감을 갖고 체계적 업무 수행 능력을 배양하게 돕는다.", "관리자와 피교육자 간 시간 낭비가 없도록 사적 친밀감보다는 공적 시스템에 의하여 교육한다.", "지도자의 높은 자질이 요구되며 교육훈련의 체계화가 어렵다는 단점이 있다."], answer: 2, explanation: "OJT의 효과를 위해서는 지도자와 피교육자 사이의 친밀감이 필요하다." },

  { id: "round3-021", set: "2024 3회", subject: "", question: "다음 중 식중독의 원인균이 아닌 것은?", choices: ["Escherichia coli", "Vibrio parahaemolyticus", "Staphylococcus aureus", "Shigella dysenteriae"], answer: 3, explanation: "Shigella dysenteriae는 세균성이질(감염병)의 원인균이다." },

  { id: "round3-025", set: "2024 3회", subject: "", question: "슈 제조 공정 중 잘못된 것은?", choices: ["밀가루를 호화시킨 후 즉시 달걀 전량을 넣는다.", "슈 반죽을 짠 후 분무하거나 물을 붓고 침지 후 물을 따라 버리고 굽는다.", "굽기 과정 중 가급적 문을 열지 않고 굽는다.", "슈 반죽의 되기는 달걀로 조절한다."], answer: 0, explanation: "반죽이 너무 뜨거우면 달걀이 익을 수 있으므로 조금 식혀 60℃ 이하에서 달걀을 넣는다." },
  { id: "round3-026", set: "2024 3회", subject: "", question: "원가에 대한 설명 중 옳지 않은 것은?", choices: ["원가의 3요소는 재료비, 노무비, 경비이다.", "제조 원가는 직접 원가에 제조 간접비를 더한 것이다.", "총원가는 제조 원가에 판매비와 일반관리비를 더한 것이다.", "판매 원가는 총원가에 판매 이익과 마케팅비를 더한 것이다."], answer: 3, explanation: "판매 원가는 총원가에 이익을 더한 것이다." },

  { id: "round3-028", set: "2024 3회", subject: "", question: "반죽에 베이킹파우더를 많이 사용한 경우의 문제점이 아닌 것은?", choices: ["밀도가 높고 부피가 크다.", "속색이 어둡고 맛에는 쓴맛이 난다.", "속결이 거칠고 빨리 건조되어 노화가 빠르게 진행된다.", "오븐 스프링이 과도하여 찌그러질 수 있다."], answer: 0, explanation: "베이킹파우더를 많이 사용하면 팽창이 과도하여 밀도가 낮아지고 부피가 커진다." },
  { id: "round3-029", set: "2024 3회", subject: "", question: "동물의 장에 상시 서식하는 박테리아의 일종으로, 오염된 물이나 식품에서 분변오염의 지표균으로 사용되는 식중독의 학명은?", choices: ["Escherichia coli", "Salmonella spp.", "Staphylococcus epidermidis", "Bacillus cereus"], answer: 0, explanation: "Escherichia coli(E. coli)는 대장균의 학명이다." },
  { id: "round3-030", set: "2024 3회", subject: "", question: "다음 중 필수 아미노산이 아닌 것은?", choices: ["시스테인", "발린", "라이신", "류신"], answer: 0, explanation: "필수 아미노산에는 발린, 라이신, 류신 등이 포함되며 시스테인은 포함되지 않는다." },
  { id: "round3-031", set: "2024 3회", subject: "", question: "다크 초콜릿 템퍼링 순서와 온도가 옳지 않은 것은?", choices: ["1단계: 초콜릿을 49℃ 정도로 녹여 카카오버터의 결정화를 부순다.", "2단계: 25℃ 정도로 내려 결정화가 신속하게 진행되도록 한다.", "3단계: 31℃ 정도로 온도를 다시 올려 안정적인 결합이 되도록 한다.", "4단계: 작업 진행 중 초콜릿이 다시 굳어지지 않도록 적정한 온도를 유지한다."], answer: 1, explanation: "다크 초콜릿의 템퍼링 2단계 온도는 약 27℃가 적당하다." },
  { id: "round3-032", set: "2024 3회", subject: "", question: "동물성 식중독 중 모시조개, 바지락에 함유된 독성물질은?", choices: ["삭시톡신", "베네루핀", "테트로도톡신", "시큐톡신"], answer: 1, explanation: "모시조개, 바지락, 굴의 독성물질은 베네루핀이다." },

  { id: "round3-034", set: "2024 3회", subject: "", question: "다음 중 관능검사가 아닌 것은?", choices: ["크기 및 모양", "조직감", "색상", "검사"], answer: 3, explanation: "관능검사는 인간의 감각을 계측기로 하는 시각·후각·미각·촉각·청각 검사이다." },
  { id: "round3-035", set: "2024 3회", subject: "", question: "오버런(Over-run)이 가장 큰 크림은?", choices: ["콤파운드 버터", "식물성 생크림", "동물성 생크림", "식용유"], answer: 1, explanation: "유지방 함량이 적을수록 오버런이 높으며 식물성 생크림의 오버런이 가장 크고 안정적이다." },
  { id: "round3-036", set: "2024 3회", subject: "", question: "재고회전율에 대한 설명으로 틀린 것은?", choices: ["재고량과는 반비례한다.", "총매출액을 재고액으로 나눈 것이다.", "월초 재고량과 월말 재고량의 평균치이다.", "수요량과는 정비례한다."], answer: 2, explanation: "월초 재고량과 월말 재고량의 평균치는 평균 재고량이며, 재고회전율 자체의 설명이 아니다." },
  { id: "round3-037", set: "2024 3회", subject: "", question: "페이스트리 제조 시 주의할 점이 아닌 것은?", choices: ["반죽과 충전용 유지 온도는 동일해야 한다.", "밀어 펴기 시 덧가루를 많이 사용해야 한다.", "2차 발효실 온도는 충전용 유지의 융점보다 낮아야 한다.", "발효가 지나치면 굽기 중 유지가 층으로부터 새어 나온다."], answer: 1, explanation: "과도한 덧가루는 결을 단단하게 하고 제품이 부서지기 쉬우므로 소량만 사용한다." },
  { id: "round3-038", set: "2024 3회", subject: "", question: "박력분에 대한 설명으로 옳은 것은?", choices: ["연질소맥을 제분한다.", "다목적으로 사용되며 반죽 형성 시간이 빠르다.", "반죽 혼합 시 흡수율이 높다.", "밀가루 입자가 가장 크다."], answer: 0, explanation: "박력분은 연질소맥을 제분하며 단백질과 흡수율이 낮고 입자가 작아 주로 과자용으로 사용된다." },
  { id: "round3-039", set: "2024 3회", subject: "", question: "HACCP 화학적 위해요소가 아닌 것은?", choices: ["바이러스 위해요소", "자연독소 위해요소", "식품첨가물 위해요소", "중금속 위해요소"], answer: 0, explanation: "바이러스는 생물학적 위해요소이다." },
  { id: "round3-040", set: "2024 3회", subject: "", question: "단위당 판매가격이 90원, 변동비 70원, 고정비 8,000원이라면 손익분기점의 판매량은?", choices: ["100개", "200개", "300개", "400개"], answer: 3, explanation: "(90-70)×판매량=8,000이므로 판매량은 400개이다." },
  { id: "round3-041", set: "2024 3회", subject: "", question: "도넛을 튀길 때 발한 현상에 대한 대책으로 잘못된 것은?", choices: ["도넛에 묻히는 설탕량을 증가시킨다.", "튀김 시간을 늘려 도넛의 수분 함량을 줄인다.", "도넛 반죽의 되기를 질게 한다.", "도넛을 40℃ 정도로 식혀 설탕을 묻힌다."], answer: 2, explanation: "도넛 반죽이 질면 발한 현상이 더 커진다." },
  { id: "round3-042", set: "2024 3회", subject: "", question: "파이 반죽 제조 시 충전물의 노화방지제에 대한 설명으로 틀린 것은?", choices: ["호화를 빠르게 진행시킨다.", "광택, 색, 향을 유지시킨다.", "냉각 후 농도를 유지시킨다.", "노화방지제로 주로 설탕을 사용한다."], answer: 3, explanation: "파이의 노화방지제로는 달걀, 전분 등을 사용한다." },
  { id: "round3-043", set: "2024 3회", subject: "", question: "HACCP 기준 중 모니터링 담당자의 임무로 옳지 않은 것은?", choices: ["작업 중 기기 고장일 경우 즉시 작업을 중지하고 공정품을 보류한다.", "가열 온도, 가열 시간 미달 시 모니터링 일지에 기록하고 즉시 폐기한다.", "가열 온도 및 가열 시간 초과 시는 품질 상태를 확인한 후 다음 공정을 진행한다.", "모니터링 주기에 따라 가열 온도 및 가열 시간을 확인하고 일지에 기록한다."], answer: 2, explanation: "가열 온도 및 시간 초과 시는 공정 진행을 중지하고 품질을 확인한 후 폐기한다." },
  { id: "round3-044", set: "2024 3회", subject: "", question: "외부 업체에 미생물 검사를 의뢰했다. 이때 미생물 규격은 n=5, c=5, m=10,000, M=50,000이다. 여기서 c는 무엇을 나타내는가?", choices: ["검사하기 위한 시료의 수", "최대허용 시료 수", "미생물 허용 기준치", "미생물 허용 한계치"], answer: 1, explanation: "미생물 시험 규격에서 c는 최대 허용 시료 수를 뜻한다." },

  { id: "round3-046", set: "2024 3회", subject: "", question: "아몬드 스펀지 케이크 제조 공정에 대한 설명 중 잘못된 것은?", choices: ["달걀을 중탕으로 충분히 거품 내고 설탕을 섞는다.", "체 친 아몬드 가루와 밀가루를 섞는다.", "비중은 0.5 정도가 적당하다.", "팬닝 후 180℃에서 30분 정도 굽는다."], answer: 0, explanation: "더운 공립법으로 중탕할 때는 달걀과 설탕, 소금을 섞어 약 43℃로 따뜻하게 중탕한다." },
  { id: "round3-047", set: "2024 3회", subject: "", question: "식품에 식염을 첨가함으로써 미생물 증식을 억제하는 효과로 옳지 않은 것은?", choices: ["탈수 작용에 의한 식품 내 수분 감소", "산소의 용해도 감소", "삼투압 증가", "품질 유지 및 향상"], answer: 3, explanation: "품질 유지 및 향상은 식품첨가물의 역할이며 식염의 미생물 증식 억제 원리가 아니다." },
  { id: "round3-048", set: "2024 3회", subject: "", question: "사용 금지된 유해 감미료는?", choices: ["아스파탐", "둘신", "스테비오사이드", "사카린나트륨"], answer: 1, explanation: "둘신과 사이클라메이트는 사용이 금지된 유해 감미료이다." },
  { id: "round3-049", set: "2024 3회", subject: "", question: "감염병 중 바이러스에 의해 감염되지 않는 것은?", choices: ["장티푸스", "폴리오", "인플루엔자", "유행성간염"], answer: 0, explanation: "폴리오, 인플루엔자, 유행성간염은 바이러스성 감염병이며 장티푸스는 세균성이다." },
  { id: "round3-050", set: "2024 3회", subject: "", question: "자당의 분해 과정으로 옳은 것은?", choices: ["말타아제에 의해 두 분자의 포도당으로 분해된다.", "락타아제에 의해 포도당과 갈락토오스로 분해된다.", "찌마아제에 의해 포도당과 유당으로 분해된다.", "인버타아제에 의해 과당과 포도당으로 분해된다."], answer: 3, explanation: "자당은 인버타아제에 의해 과당과 포도당으로 분해된다." },
  { id: "round3-051", set: "2024 3회", subject: "", question: "단백질의 주요 기능이 아닌 것은?", choices: ["체조직 구성", "에너지 발생", "대사작용 조절", "호르몬 형성"], answer: 2, explanation: "대사작용 조절은 무기질, 물, 비타민의 기능이다." },
  { id: "round3-052", set: "2024 3회", subject: "", question: "식품을 채취, 제조, 가공, 조리, 저장, 운반 또는 판매하는 직접 종사자는 연 1회 정기건강진단을 받는데 건강진단 항목이 아닌 것은?", choices: ["전염성 피부 질환", "장티푸스", "이질", "폐결핵"], answer: 2, explanation: "건강진단 항목은 전염성 피부 질환, 폐결핵, 장티푸스 등이다." },
  { id: "round3-053", set: "2024 3회", subject: "", question: "소독제에 의한 소독 시 사용하는 농도가 잘못된 것은?", choices: ["석탄산: 3~5% 수용액", "승홍수: 0.1% 수용액", "알코올: 36% 수용액", "과산화수소: 3% 수용액"], answer: 2, explanation: "소독용 알코올은 약 70%가 적당하다." },
  { id: "round3-054", set: "2024 3회", subject: "", question: "햄이나 베이컨을 만들 때 훈연(Smoking) 목적과 관계없는 것은?", choices: ["조직의 연화", "제품의 색 향상", "보존성 부여", "풍미 향상"], answer: 0, explanation: "훈연의 목적은 방부·항산화 작용, 풍미 부여, 착색 작용 등이다." },
  { id: "round3-055", set: "2024 3회", subject: "", question: "생산관리 체계와 거리가 먼 것은?", choices: ["제품 품질관리", "제품의 표준화", "원가관리", "기업 환경 분석"], answer: 3, explanation: "생산관리에는 생산 준비, 생산량 확인, 품질관리, 제품 표준화·단순화·전문화, 원가관리 등이 포함된다." },
  { id: "round3-056", set: "2024 3회", subject: "", question: "당대사의 중요 물질로 두뇌, 신경, 적혈구의 에너지원으로 이용되는 당은?", choices: ["과당", "전분", "유당", "포도당"], answer: 3, explanation: "포도당은 적혈구, 뇌세포, 신경세포의 주요 에너지원이며 체내 당대사의 중심 물질이다." },
  { id: "round3-057", set: "2024 3회", subject: "", question: "크림법 반죽에 대한 설명으로 잘못된 것은?", choices: ["비중이 가볍고 조직이 부드럽다.", "화학적 팽창제를 사용한다.", "유지와 설탕의 사용량이 많다.", "비교적 굽는 시간이 길다."], answer: 0, explanation: "크림법은 비중이 무겁고 화학적 팽창제를 사용하며 유지, 설탕, 달걀, 밀가루 함량이 많고 굽는 시간도 긴 편이다." },
  { id: "round3-058", set: "2024 3회", subject: "", question: "스펀지 케이크 제조 시 달걀 사용량이 16% 감소했다면 밀가루 사용의 변화는?", choices: ["2%", "3%", "4%", "5%"], answer: 2, explanation: "달걀 16%의 고형분은 4%이므로 밀가루 4%로 대체할 수 있다." },
  { id: "round3-059", set: "2024 3회", subject: "", question: "종업원의 손 소독용 역성비누의 특징 중 잘못 설명한 것은?", choices: ["독성이 적고 살균력이 강하다.", "보통비누와 혼용하면 살균효과가 감소한다.", "점착성이 있다.", "분변과 환자의 토물 소독에 적당하다."], answer: 3, explanation: "배설물과 화장실 소독에는 3% 크레졸이나 생석회를 사용한다." },
  { id: "round3-060", set: "2024 3회", subject: "", question: "살균, 소독에 대한 설명 중 옳지 않은 것은?", choices: ["열탕 또는 증기 소독 후 살균된 용기를 충분히 건조해야 그 효과가 유지된다.", "우유의 저온 살균은 결핵균 살균을 목적으로 한다.", "자외선 살균은 대부분의 물질을 투과하지 않는다.", "방사선은 발아 억제 효과만 있고 살균효과는 없다."], answer: 3, explanation: "방사선은 발아 억제뿐 아니라 살균에도 이용된다." }
];
</script>
<script>
(function(){
  "use strict";

  var STORAGE_KEY = "breadquiz_v1";

  // ---------- 저장 데이터 ----------
  function loadStore(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultStore();
      var parsed = JSON.parse(raw);
      return Object.assign(defaultStore(), parsed);
    }catch(e){
      return defaultStore();
    }
  }
  function defaultStore(){
    return {
      stats: {},        // { subject: {correct, total} }
      wrongIds: [],     // 틀린 문제 id 배열
      session: null,    // 진행 중 세션 (이어풀기용)
      setProgress: {}   // { setId: { solved: [id,...], correct: {id: bool} } }
    };
  }
  function saveStore(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  }
  var store = loadStore();

  // ---------- 유틸 ----------
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }
  function byId(id){ return document.getElementById(id); }
  function show(el){ el.classList.remove("hidden"); }
  function hide(el){ el.classList.add("hidden"); }

  var screens = {
    home: byId("screen-home"),
    quiz: byId("screen-quiz"),
    result: byId("screen-result")
  };
  function goto(name){
    Object.keys(screens).forEach(function(k){
      if(k===name) show(screens[k]); else hide(screens[k]);
    });
    window.scrollTo(0,0);
  }

  // ---------- 문제지 set 목록 추출 ----------
  // QUESTIONS 배열의 각 문제에 set 필드(예: "2024 1회")가 있다고 가정
  // set 필드가 없으면 "기타"로 묶음
  function getSets(){
    if(typeof QUESTIONS === "undefined" || QUESTIONS.length === 0) return [];
    var order = [];
    var map = {};
    QUESTIONS.forEach(function(q){
      var setName = q.set || "기타";
      if(!map[setName]){
        map[setName] = [];
        order.push(setName);
      }
      map[setName].push(q);
    });
    return order.map(function(name){ return { name: name, questions: map[name] }; });
  }

  // ---------- set 진도 계산 ----------
  function getSetProgress(setName, questions){
    var prog = store.setProgress[setName];
    var total = questions.length;
    if(!prog || !prog.solved || prog.solved.length === 0){
      return { solved: 0, total: total, pct: 0 };
    }
    var solved = prog.solved.length;
    return {
      solved: Math.min(solved, total),
      total: total,
      pct: Math.round((Math.min(solved, total) / total) * 100)
    };
  }

  // ---------- 홈 화면 렌더 ----------
  var currentSetName = null;  // 모달에서 선택 중인 set

  function renderHome(){
    var setList = byId("set-list");
    setList.innerHTML = "";
    var sets = getSets();

    if(sets.length === 0){
      var p = document.createElement("p");
      p.className = "no-data";
      p.style.marginTop = "8px";
      p.textContent = "아직 등록된 문제가 없어요. questions.js에 문제를 추가해주세요.";
      setList.appendChild(p);
    } else {
      sets.forEach(function(s){
        var prog = getSetProgress(s.name, s.questions);
        var card = document.createElement("button");
        card.className = "set-card";
        card.innerHTML =
          '<div class="set-card-info">'+
            '<div class="set-card-name">'+s.name+'</div>'+
            '<div class="set-card-bar-wrap">'+
              '<div class="set-bake-bar"><div class="set-bake-bar-fill" style="width:'+prog.pct+'%"></div></div>'+
              '<div class="set-card-pct">'+prog.pct+'%</div>'+
            '</div>'+
            '<div class="set-card-count">'+prog.solved+' / '+prog.total+'문제 완료</div>'+
          '</div>'+
          '<span class="menu-arrow">›</span>';
        card.addEventListener("click", function(){ openSetModal(s.name, s.questions); });
        setList.appendChild(card);
      });
    }

    var wrongBtn = byId("btn-wrong");
    var wrongDesc = byId("wrong-desc");
    var wrongCount = store.wrongIds.length;
    wrongDesc.textContent = wrongCount+"문제 저장됨";
    wrongBtn.disabled = wrongCount===0;
  }

  // ---------- set 선택 모달 ----------
  function openSetModal(setName, questions){
    currentSetName = setName;
    byId("modal-set-name").textContent = setName;
    var prog = getSetProgress(setName, questions);
    byId("modal-set-progress").textContent = prog.solved+" / "+prog.total+"문제 완료 · "+prog.pct+"%";

    // 이어풀기: 해당 set의 진행 중인 session이 있을 때만 활성화
    var continueBtn = byId("modal-btn-continue");
    var hasSession = store.session &&
                     store.session.setName === setName &&
                     store.session.queue &&
                     store.session.index < store.session.queue.length;
    continueBtn.disabled = !hasSession;

    show(byId("set-modal-overlay"));
  }

  function closeSetModal(){
    hide(byId("set-modal-overlay"));
    currentSetName = null;
  }

  // ---------- 순서 선택 모달 ----------
  function openOrderModal(){
    // closeSetModal 대신 직접 숨김 — currentSetName 유지
    hide(byId("set-modal-overlay"));
    show(byId("order-modal-overlay"));
  }

  function closeOrderModal(){
    hide(byId("order-modal-overlay"));
    currentSetName = null;
  }

  // ---------- 세션 시작 ----------
  function startSetSession(setName, randomOrder){
    var sets = getSets();
    var found = null;
    sets.forEach(function(s){ if(s.name === setName) found = s; });
    if(!found || found.questions.length === 0){
      alert("문제를 찾을 수 없어요.");
      return;
    }
    var pool = randomOrder ? shuffle(found.questions) : found.questions.slice();
    var queue = pool.map(function(q){ return q.id; });
    store.session = { queue: queue, index: 0, correctCount: 0, log: [], mode: "set", setName: setName };
    saveStore();
    runQuestion();
  }

  function continueSetSession(){
    if(!store.session) return;
    runQuestion();
  }

  function startWrongSession(){
    var idSet = {};
    var queue = store.wrongIds.filter(function(id){
      if(idSet[id]) return false;
      idSet[id]=true;
      return QUESTIONS.some(function(q){return q.id===id;});
    });
    if(queue.length===0){
      alert("틀린 문제가 없어요.");
      return;
    }
    store.session = { queue: shuffle(queue), index: 0, correctCount: 0, log: [], mode: "wrong", setName: null };
    saveStore();
    runQuestion();
  }

  // ---------- 퀴즈 진행 ----------
  var currentAnswered = false;

  function findQuestion(id){
    for(var i=0;i<QUESTIONS.length;i++){
      if(QUESTIONS[i].id===id) return QUESTIONS[i];
    }
    return null;
  }

  function runQuestion(){
    var sess = store.session;
    if(!sess || sess.index >= sess.queue.length){
      finishSession();
      return;
    }
    var q = findQuestion(sess.queue[sess.index]);
    if(!q){
      sess.index++;
      saveStore();
      runQuestion();
      return;
    }
    currentAnswered = false;
    goto("quiz");

    byId("progress-count").textContent = (sess.index+1)+"/"+sess.queue.length;
    byId("progress-fill").style.width = Math.round((sess.index/sess.queue.length)*100)+"%";
    byId("subject-tag").textContent = q.subject;
    byId("question-text").textContent = q.question;

    var passageBox = byId("passage-box");
    if(q.passage){
      passageBox.textContent = q.passage;
      show(passageBox);
    }else{
      hide(passageBox);
    }

    var choicesEl = byId("choices");
    choicesEl.innerHTML = "";
    q.choices.forEach(function(choiceText, idx){
      var btn = document.createElement("button");
      btn.className = "choice";
      btn.innerHTML = '<span class="choice-num">'+(idx+1)+'</span><span>'+choiceText+'</span>';
      btn.addEventListener("click", function(){ selectAnswer(q, idx, choicesEl); });
      choicesEl.appendChild(btn);
    });

    hide(byId("feedback-box"));
    byId("feedback-box").classList.remove("show","correct","wrong");
    byId("btn-next").classList.remove("show");
  }

  function selectAnswer(q, idx, choicesEl){
    if(currentAnswered) return;
    currentAnswered = true;

    var isCorrect = idx === q.answer;
    var buttons = choicesEl.querySelectorAll(".choice");
    buttons.forEach(function(btn, i){
      btn.classList.add("disabled");
      if(i === q.answer) btn.classList.add("correct");
      else if(i === idx) btn.classList.add("wrong");
      else btn.classList.add("dim");
    });

    // 과목별 통계 업데이트
    if(!store.stats[q.subject]) store.stats[q.subject] = {correct:0, total:0};
    store.stats[q.subject].total++;
    if(isCorrect) store.stats[q.subject].correct++;

    // set 진도 업데이트
    var sess = store.session;
    if(sess.setName){
      if(!store.setProgress[sess.setName]) store.setProgress[sess.setName] = { solved: [], correct: {} };
      var sp = store.setProgress[sess.setName];
      if(sp.solved.indexOf(q.id) === -1) sp.solved.push(q.id);
      sp.correct[q.id] = isCorrect;
    }

    // 오답노트 업데이트
    var wrongIdx = store.wrongIds.indexOf(q.id);
    if(isCorrect){
      if(wrongIdx>-1) store.wrongIds.splice(wrongIdx,1);
    }else{
      if(wrongIdx===-1) store.wrongIds.push(q.id);
    }

    // 세션 로그
    sess.log.push({ id:q.id, question:q.question, correct:isCorrect });
    if(isCorrect) sess.correctCount++;

    saveStore();

    var fb = byId("feedback-box");
    var label = byId("feedback-label");
    var text = byId("feedback-text");
    fb.classList.remove("correct","wrong");
    fb.classList.add(isCorrect ? "correct" : "wrong", "show");
    label.textContent = isCorrect ? "정답이에요" : "아쉬워요, 오답이에요";
    text.textContent = q.explanation || "";

    byId("btn-next").classList.add("show");
  }

  function nextQuestion(){
    var sess = store.session;
    sess.index++;
    saveStore();
    runQuestion();
  }

  function finishSession(){
    var sess = store.session;
    var total = sess.queue.length;
    var correct = sess.correctCount;

    byId("result-total-label").innerHTML = correct+"<span> / "+total+"</span>";
    var pct = total>0 ? Math.round((correct/total)*100) : 0;
    var caption = pct>=80 ? "잘 구워졌어요!" : (pct>=50 ? "조금만 더 반죽해봐요" : "이 판은 다시 한번 풀어봐요");
    byId("result-caption").textContent = caption+" · 정답률 "+pct+"%";

    var list = byId("result-list");
    list.innerHTML = "";
    sess.log.forEach(function(item){
      var row = document.createElement("div");
      row.className = "result-item";
      row.innerHTML =
        '<span class="result-mark '+(item.correct?"o":"x")+'">'+(item.correct?"O":"X")+'</span>'+
        '<span class="result-item-text">'+item.question+'</span>';
      list.appendChild(row);
    });

    store.session = null;
    saveStore();
    goto("result");
  }

  // ---------- 이벤트 바인딩 ----------
  // set 선택 모달
  byId("modal-btn-new").addEventListener("click", function(){
    openOrderModal();
  });
  byId("modal-btn-continue").addEventListener("click", function(){
    closeSetModal();
    continueSetSession();
  });
  byId("modal-close").addEventListener("click", closeSetModal);
  byId("set-modal-overlay").addEventListener("click", function(e){
    if(e.target === this) closeSetModal();
  });

  // 순서 선택 모달
  byId("order-btn-random").addEventListener("click", function(){
    var sn = currentSetName;
    closeOrderModal();
    startSetSession(sn, true);
  });
  byId("order-btn-original").addEventListener("click", function(){
    var sn = currentSetName;
    closeOrderModal();
    startSetSession(sn, false);
  });
  byId("order-close").addEventListener("click", function(){
    var sn = currentSetName;
    closeOrderModal();
    if(sn){
      var sets = getSets();
      sets.forEach(function(s){ if(s.name === sn) openSetModal(s.name, s.questions); });
    }
  });
  byId("order-modal-overlay").addEventListener("click", function(e){
    if(e.target === this){
      var sn = currentSetName;
      closeOrderModal();
      if(sn){
        var sets = getSets();
        sets.forEach(function(s){ if(s.name === sn) openSetModal(s.name, s.questions); });
      }
    }
  });

  byId("btn-wrong").addEventListener("click", startWrongSession);
  byId("btn-next").addEventListener("click", nextQuestion);
  byId("btn-result-home").addEventListener("click", function(){
    renderHome();
    goto("home");
  });
  byId("btn-quit").addEventListener("click", function(){
    renderHome();
    goto("home");
  });

  // ---------- 시작 ----------
  renderHome();
  goto("home");
})();
</script>
</body>
</html>
